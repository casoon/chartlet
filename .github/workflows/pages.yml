name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The site renders every chart with the chartlet CLI; the version comes from
      # rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release

      # The playground runs the compiler as WebAssembly; site/scripts/prepare-playground.mjs
      # copies the module next to the page. Without it the page shows its load-failure state.
      - name: Build WebAssembly renderer
        run: node packages/chartlet/scripts/build-wasm.mjs

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - uses: actions/configure-pages@v6

      - name: Build site
        working-directory: site
        env:
          CHARTLET_BIN: ${{ github.workspace }}/target/release/chartlet
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
