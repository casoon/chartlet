name: Release

# Tag `vX.Y.Z` → check the crate, both npm packages and the Python package, then
# publish them after approval: the crate through crates.io Trusted Publishing in
# the `crates-io` environment, the npm packages through npm Trusted Publishing
# (provenance) in the `npm` environment, the Python package through PyPI Trusted
# Publishing (attestations) in the `pypi` environment. Each exchanges a GitHub
# OIDC token for a short-lived one, so no registry token is stored anywhere; the
# environments have a required reviewer, so a publish stays a deliberate step. See "Releasing" in
# CONTRIBUTING.md.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # The same wasm-opt as ci.yml and the local builds.
  BINARYEN: version_133

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          for p in chartlet chartlet-mcp; do
            test "$version" = "$(node -p "require('./packages/$p/package.json').version")"
          done
          test "$version" = "$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml | head -1)"

      # The version, components and targets come from rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install wasm-opt
        run: |
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN/binaryen-$BINARYEN-x86_64-linux.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-$BINARYEN/bin" >> "$GITHUB_PATH"

      # Packs both packages (the WebAssembly build and the schema copy run in
      # `prepack`), installs the tarballs into an empty project and uses them.
      - name: Smoke install
        run: node scripts/smoke-install.mjs

      # The wheel and sdist of the Python package, with the WebAssembly build the
      # smoke install made; installed into an empty environment and used once.
      # The publish job uploads exactly these files.
      - name: Python package
        env:
          CHARTLET_WASM: ${{ github.workspace }}/packages/chartlet/src/chartlet.wasm
        run: |
          python3 -m venv "$RUNNER_TEMP/build"
          "$RUNNER_TEMP/build/bin/pip" install --quiet build
          "$RUNNER_TEMP/build/bin/python" -m build --outdir "$RUNNER_TEMP/python-dist" python
          python3 -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install --quiet "$RUNNER_TEMP"/python-dist/*.whl
          cd "$RUNNER_TEMP"
          smoke/bin/python -c "import chartlet, pathlib; assert chartlet.render(pathlib.Path('$GITHUB_WORKSPACE/examples/monthly-revenue.json')) == pathlib.Path('$GITHUB_WORKSPACE/examples/monthly-revenue.svg').read_text()"

      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: ${{ runner.temp }}/python-dist
          if-no-files-found: error

      # Packs and builds the crate as crates.io would receive it.
      - name: Crate package
        run: cargo publish --dry-run --locked

  publish-crate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup toolchain install

      # A version that is on crates.io already (an earlier run, a hand publish)
      # is skipped, so a rerun after a failed npm publish passes here.
      - name: Already published?
        id: check
        run: |
          version="${GITHUB_REF_NAME#v}"
          if curl -sSf https://index.crates.io/ch/ar/chartlet | grep -q "\"vers\":\"$version\""; then
            echo "chartlet $version is on crates.io already — skipped"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.check.outputs.skip != 'true'
        id: auth

      - name: Publish
        if: steps.check.outputs.skip != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm (Trusted Publishing needs >= 11.5)
        run: npm install -g npm@latest

      - name: Install wasm-opt
        run: |
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN/binaryen-$BINARYEN-x86_64-linux.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-$BINARYEN/bin" >> "$GITHUB_PATH"

      # `npm pack` runs `prepack`; `npm publish` of the tarball signs the
      # provenance. The grid first: the MCP server depends on it. A release
      # interrupted halfway is finished by running the job again.
      - name: Publish
        run: |
          set -euo pipefail
          for p in chartlet chartlet-mcp; do
            dir="packages/$p"
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is on npm already — skipped"
              continue
            fi
            tarball=$(cd "$dir" && npm pack --silent --pack-destination "$RUNNER_TEMP" | tail -1)
            npm publish --access public "$RUNNER_TEMP/$tarball"
          done

  publish-pypi:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      # A version that is on PyPI already is skipped, like the other registries.
      - name: Already published?
        id: check
        run: |
          version="${GITHUB_REF_NAME#v}"
          if curl -sSf "https://pypi.org/pypi/chartlet/$version/json" >/dev/null 2>&1; then
            echo "chartlet $version is on PyPI already — skipped"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Trusted Publishing; the action signs and uploads PEP 740 attestations.
      - name: Publish
        if: steps.check.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
