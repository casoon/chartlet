<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" id="chartlet-ebb207df7252265a" role="img" aria-labelledby="chartlet-ebb207df7252265a-title chartlet-ebb207df7252265a-description" class="chartlet-root"><title id="chartlet-ebb207df7252265a-title">Life of a support ticket</title><desc id="chartlet-ebb207df7252265a-description">State diagram with 9 states and 10 transitions. It starts in New. Final states: Closed and Rejected. Main path: New → Triaged → Severity? → In progress → Resolved → Closed. New to Triaged on review. Triaged to Severity? on classify. Severity? to In progress on [valid] / assign. Severity? to Rejected on [duplicate]. In progress to Waiting for customer on ask. In progress to Resolved on fix shipped. Waiting for customer to In progress on reply. Waiting for customer to itself on after 3 days / remind. Resolved to In progress on reopen. Resolved to Closed on after 7 days. Composite state Being handled contains In progress, Waiting for customer. Choices: Severity?.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-ebb207df7252265a .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-ebb207df7252265a .chartlet-label,#chartlet-ebb207df7252265a .chartlet-tick,#chartlet-ebb207df7252265a .chartlet-value,#chartlet-ebb207df7252265a .chartlet-value-inverse,#chartlet-ebb207df7252265a .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-ebb207df7252265a .chartlet-value,#chartlet-ebb207df7252265a .chartlet-value-inverse{font-weight:600}#chartlet-ebb207df7252265a .chartlet-value{fill:var(--chartlet-text)}#chartlet-ebb207df7252265a