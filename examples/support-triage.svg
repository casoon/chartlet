o{stroke:var(--chartlet-zero);stroke-width:1.5}#chartlet-72982ec239d82b54 .chartlet-bar,#chartlet-72982ec239d82b54 .chartlet-point{fill:var(--chartlet-accent)}#chartlet-72982ec239d82b54 .chartlet-line{fill:none;stroke:var(--chartlet-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}#chartlet-72982ec239d82b54 .chartlet-background{fill:var(--chartlet-background)}.chartlet-root{--chartlet-node:#eef3fd;--chartlet-lane:#f7f9fc;--chartlet-lane-head:#eef1f6;--chartlet-shadow:rgba(16,24,40,.09);--chartlet-role-blue:#2563eb;--chartlet-role-blue-fill:#eef3fd;--chartlet-role-green:#15803d;--chartlet-role-green-fill:#ecfdf3;--chartlet-role-amber:#b45309;--chartlet-role-amber-fill:#fff7e8;--chartlet-role-teal:#0f766e;--chartlet-role-teal-fill:#e9faf7;--chartlet-role-violet:#6d28d9;--chartlet-role-violet-fill:#f3efff;--chartlet-role-gray:#667085;--chartlet-role-gray-fill:#f7f8fa;--chartlet-role-red:#b42318;--chartlet-role-red-fill:#fef3f2}.chartlet-root.chartlet-theme-dark{--chartlet-node:#1a2436;--chartlet-lane:#121925;--chartlet-lane-head:#18212f;--chartlet-shadow:rgba(0,0,0,.45);--chartlet-role-blue:#7ea6ff;--chartlet-role-blue-fill:#1a2436;--chartlet-role-green:#4ade80;--chartlet-role-green-fill:#132a1d;--chartlet-role-amber:#fbbf24;--chartlet-role-amber-fill:#2b2210;--chartlet-role-teal:#2dd4bf;--chartlet-role-teal-fill:#0f2a27;--chartlet-role-violet:#b69cff;--chartlet-role-violet-fill:#231c38;--chartlet-role-gray:#9aa7bd;--chartlet-role-gray-fill:#161d29;--chartlet-role-red:#f97066;--chartlet-role-red-fill:#2d1616}#chartlet-72982ec239d82b54 .chartlet-role-blue{fill:var(--chartlet-role-blue-fill);stroke:var(--chartlet-role-blue)}#chartlet-72982ec239d82b54 .chartlet-role-green{fill:var(--chartlet-role-green-fill);stroke:var(--chartlet-role-green)}#chartlet-72982ec239d82b54 .chartlet-role-amber{fill:var(--chartlet-role-amber-fill);stroke:var(--chartlet-role-amber)}#chartlet-72982ec239d82b54 .chartlet-role-teal{fill:var(--chartlet-role-teal-fill);stroke:var(--chartlet-role-teal)}#chartlet-72982ec239d82b54 .chartlet-role-violet{fill:var(--chartlet-role-violet-fill);stroke:var(--chartlet-role-violet)}#chartlet-72982ec239d82b54 .chartlet-role-gray{fill:var(--chartlet-role-gray-fill);stroke:var(--chartlet-role-gray)}#chartlet-72982ec239d82b54 .chartlet-role-red{fill:var(--chartlet-role-red-fill);stroke:var(--chartlet-role-red)}#chartlet-72982ec239d82b54 .chartlet-diagram-rim{fill:none;stroke:var(--chartlet-role-teal);stroke-width:1.5}#chartlet-72982ec239d82b54 .chartlet-diagram-shadow{fill:var(--chartlet-shadow);stroke:none;rx:7px}#chartlet-72982ec239d82b54 .chartlet-diagram-chip{fill:var(--chartlet-background);stroke:var(--chartlet-grid);stroke-width:1;rx:4px}#chartlet-72982ec239d82b54 .chartlet-diagram-chip-text{font-size:12px;fill:var(--chartlet-text)}#chartlet-72982ec239d82b54 .chartlet-diagram-badge{fill:var(--chartlet-accent);stroke:var(--chartlet-background);stroke-width:2}#chartlet-72982ec239d82b54 .chartlet-diagram-badge-text{font-size:10px;font-weight:700;fill:var(--chartlet-background)}#chartlet-72982ec239d82b54 .chartlet-flow-node{stroke-width:1.5;stroke-linejoin:round;rx:7px}#chartlet-72982ec239d82b54 .chartlet-flow-start{stroke-width:2}#chartlet-72982ec239d82b54 .chartlet-flow-end{stroke-width:3}#chartlet-72982ec239d82b54 .chartlet-flow-external{stroke-dasharray:5 3}#chartlet-72982ec239d82b54 .chartlet-flow-inner{stroke:var(--chartlet-role-blue);stroke-width:1}#chartlet-72982ec239d82b54 .chartlet-flow-label{font-size:13px;font-weight:600;fill:var(--chartlet-text)}#chartlet-72982ec239d82b54 .chartlet-flow-sublabel{font-size:11px;fill:var(--chartlet-muted)}#chartlet-72982ec239d82b54 .chartlet-flow-edge{fill:none;stroke:var(--chartlet-zero);stroke-width:1.4;stroke-linejoin:round}#chartlet-72982ec239d82b54 .chartlet-flow-dashed{stroke-dasharray:5 4}#chartlet-72982ec239d82b54 .chartlet-flow-dotted{stroke-dasharray:1 4;stroke-linecap:round}#chartlet-72982ec239d82b54 .chartlet-flow-main{stroke:var(--chartlet-accent);stroke-width:2.2}#chartlet-72982ec239d82b54 .chartlet-flow-head{fill:var(--chartlet-zero);stroke:var(--chartlet-zero);stroke-width:1;stroke-linejoin:round}#chartlet-72982ec239d82b54 .chartlet-flow-main-head{fill:var(--chartlet-accent);stroke:var(--chartlet-accent)}#chartlet-72982ec239d82b54 .chartlet-flow-lane{fill:var(--chartlet-lane);stroke:var(--chartlet-grid);stroke-width:1}#chartlet-72982ec239d82b54 .chartlet-flow-lane-alt{fill:var(--chartlet-background)}#chartlet-72982ec239d82b54 .chartlet-flow-lane-head{fill:var(--chartlet-lane-head);stroke:none}#chartlet-72982ec239d82b54 .chartlet-flow-lane-label{font-size:11px;font-weight:650;fill:var(--chartlet-muted);letter-spacing:.04em}#chartlet-72982ec239d82b54 .chartlet-flow-group{fill:var(--chartlet-accent);fill-opacity:.04;stroke:var(--chartlet-zero);stroke-width:1;stroke-dasharray:4 3;rx:10px}#chartlet-72982ec239d82b54 .chartlet-flow-group-label{font-size:11px;font-weight:600;fill:var(--chartlet-muted)}</style><text x="24" y="30" text-anchor="start" class="chartlet-title">Triage of a support ticket</text><g class="chartlet-f chartlet-f-0 chartlet-f-1"><polyline points="508,96 508,116" class="chartlet-flow-edge chartlet-flow-main"><title>Ticket arrives → Service down?</title></polyline><polyline points="504.5,116 508,124 511.5,116 504.5,116" class="chartlet-flow-head chartlet-flow-main-head"/></g><g class="chartlet-f chartlet-f-1 chartlet-f-2"><polyline points="484,178.857 484,233 316,233 316,252" class="chartlet-flow-edge"><title>Service down? → Page the on-call engineer: yes</title></polyline><polyline points="312.5,252 316,260 319.5,252 312.5,252" class="chartlet-flow-head"/></g><g class="chartlet-f chartlet-f-1 chartlet-f-3"><polyline points="508,188 508,252" class="chartlet-flow-edge chartlet-flow-main"><title>Service down? → Queue by product: no</title></polyline><polyline points="504.5,252 508,260 511.5,252 504.5,252" class="chartlet-flow-head chartlet-flow-main-head"/></g><g class="chartlet-f chartlet-f-2 chartlet-f-4"><polyline points="316,300 316,314 484,314 484,332" class="chartlet-flow-edge"><title>Page the on-call engineer → Answered</title></polyline><polyline points="480.5,332 484,340 487.5,332 480.5,332" class="chartlet-flow-head"/></g><g class="chartlet-f chartlet-f-3 chartlet-f-4"><polyline points="508,300 508,332" class="chartlet-flow-edge chartlet-flow-main"><title>Queue by product → Answered</title></polyline><polyline points="504.5,332 508,340 511.5,332 504.5,332" class="chartlet-flow-head chartlet-flow-main-head"/></g><g class="chartlet-f chartlet-n-0 chartlet-f-0 chartlet-f-1"></g><g class="chartlet-f chartlet-n-1 chartlet-f-0 chartlet-f-1 chartlet-f-2 chartlet-f-3"></g><g class="chartlet-f chartlet-n-2 chartlet-f-1 chartlet-f-2 chartlet-f-4"></g><g class="chartlet-f chartlet-n-3 chartlet-f-1 chartlet-f-3 chartlet-f-4"></g><g class="chartlet-f chartlet-n-4 chartlet-f-2 chartlet-f-3 chartlet-f-4"></g><g class="chartlet-f chartlet-f-1 chartlet-f-2"><rect x="449.84" y="191" width="30.16" height="21" class="chartlet-diagram-chip"/><text x="475" y="205" text-anchor="end" class="chartlet-diagram-chip-text">yes</text></g><g class="chartlet-f chartlet-f-1 chartlet-f-3"><rect x="512" y="193" width="23.44" height="21" class="chartlet-diagram-chip"/><text x="517" y="207" text-anchor="start" class="chartlet-diagram-chip-text">no</text></g><g class="chartlet-f chartlet-n-0 chartlet-f-0 chartlet-f-1"><polyline points="548,58.5 555.654,60.022 562.142,64.358 566.478,70.846 568,78.5 566.478,86.154 562.142,92.642 555.654,96.978 548,98.5 468,98.5 460.346,96.978 453.858,92.642 449.522,86.154 448,78.5 449.522,70.846 453.858,64.358 460.346,60.022 468,58.5 548,58.5" class="chartlet-diagram-shadow"/><polyline points="548,56 555.654,57.522 562.142,61.858 566.478,68.346 568,76 566.478,83.654 562.142,90.142 555.654,94.478 548,96 468,96 460.346,94.478 453.858,90.142 449.522,83.654 448,76 449.522,68.346 453.858,61.858 460.346,57.522 468,56 548,56" class="chartlet-flow-node chartlet-flow-start chartlet-role-green"><title>Ticket arrives
Mail, chat and the web form all open a ticket.
The customer gets an automatic receipt.</title></polyline><text x="508" y="80.5" text-anchor="middle" class="chartlet-flow-label">Ticket arrives</text></g><g class="chartlet-f chartlet-n-1 chartlet-f-0 chartlet-f-1 chartlet-f-2 chartlet-f-3"><polyline points="508,126.5 592,158.5 508,190.5 424,158.5 508,126.5" class="chartlet-diagram-shadow"/><polyline points="508,124 592,156 508,188 424,156 508,124" class="chartlet-flow-node chartlet-role-amber"><title>Service down?
Down means the customer cannot log in or a paid feature fails for every user of the account.</title></polyline><text x="508" y="160.5" text-anchor="middle" class="chartlet-flow-label">Service down?</text></g><g class="chartlet-f chartlet-n-2 chartlet-f-1 chartlet-f-2 chartlet-f-4"><rect x="220" y="262.5" width="192" height="40" class="chartlet-diagram-shadow"/><rect x="220" y="260" width="192" height="40" class="chartlet-flow-node chartlet-role-blue"><title>Page the on-call engineer
Within 15 minutes, day and night.
The engineer owns the ticket until the service is back.</title></rect><text x="316" y="284.5" text-anchor="middle" class="chartlet-flow-label">Page the on-call engineer</text></g><g class="chartlet-f chartlet-n-3 chartlet-f-1 chartlet-f-3 chartlet-f-4"><rect x="440" y="262.5" width="136" height="40" class="chartlet-diagram-shadow"/><rect x="440" y="260" width="136" height="40" class="chartlet-flow-node chartlet-role-blue"><title>Queue by product
