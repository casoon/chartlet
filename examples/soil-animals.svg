<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" id="chartlet-649880a37035b659" role="img" aria-labelledby="chartlet-649880a37035b659-title chartlet-649880a37035b659-description" class="chartlet-root"><title id="chartlet-649880a37035b659-title">Soil animals under one square metre</title><desc id="chartlet-649880a37035b659-description">Range chart with 8 categories, each a span from low to high and a central value. Lowest low: 10 (Earthworms). Highest high: 20,000,000 (Nematodes). Colors show groups: Microfauna: Nematodes, Rotifers; Mesofauna: Springtails, Mites, Potworms; Macrofauna: Millipedes, Centipedes, Earthworms.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-649880a37035b659 .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-649880a37035b659 .chartlet-label,#chartlet-649880a37035b659 .chartlet-tick,#chartlet-649880a37035b659 .chartlet-value,#chartlet-649880a37035b659 .chartlet-value-inverse,#chartlet-649880a37035b659 .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-649880a37035b659 .chartlet-value,#chartlet-649880a37035b659 .chartlet-value-inverse{font-weight:600}#chartlet-649880a37035b659 .chartlet-value{fill:var(--chartlet-text)}#chartlet-649880a37035b659 .chartlet-value-inverse{fill:var(--chartlet-background)}#chartlet-649880a37035b659 .chartlet-axis-title{font-weight:600}#chartlet-649880a37035b659 .chartlet-grid{stroke:var(--chartlet-grid);stroke-width:1}#chartlet-649880a37035b659 .chartlet-zero{stroke:var(--chartlet-zero);stroke-width:1.5}#chartlet-649880a37035b659 .chartlet-bar,#chartlet-649880a37035b659 .chartlet-point{fill:var(--chartlet-accent)}#chartlet-649880a37035b659 .chartlet-line{fill:none;stroke:var(--chartlet-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}#chartlet-649880a37035b659 .chartlet-background{fill:var(--chartlet-background)}#chartlet-649880a37035b659 .chartlet-range{fill:var(--chartlet-accent);fill-opacity:.3;stroke:var(--chartlet-accent);stroke-width:1}#chartlet-649880a37035b659 .chartlet-range-hatch{stroke:none}#chartlet-649880a37035b659 .chartlet-hatch-line{stroke:var(--chartlet-accent);stroke-width:1.2;opacity:.75}#chartlet-649880a37035b659 .chartlet-range-mid{stroke:var(--chartlet-text);stroke-width:3}#chartlet-649880a37035b659 .chartlet-legend{font-size:12px;fill:var(--chartlet-muted)}#chartlet-649880a37035b659 .chartlet-range-series-1{fill:var(--chartlet-color-1);stroke:var(--chartlet-color-1)}#chartlet-649880a37035b659 .chartlet-range-series-2{fill:var(--chartlet-color-2);stroke:var(--chartlet-color-2)}#chartlet-649880a37035b659 .chartlet-range-series-3{fill:var(--chartlet-color-3);stroke:var(--chartlet-color-3)}#chartlet-649880a37035b659 .chartlet-range-series-4{fill:var(--chartlet-color-4);stroke:var(--chartlet-color-4)}</style><text x="105.68" y="30" text-anchor="start" class="chartlet-title">Soil animals under one square metre</text><line x1="105.68" y1="102" x2="105.68" y2="394" class="chartlet-grid"/><text x="105.68" y="416" text-anchor="middle" class="chartlet-tick">10</text><line x1="199.686" y1="102" x2="199.686" y2="394" class="chartlet-grid"/><text x="199.686" y="416" text-anchor="middle" class="chartlet-tick">100</text><line x1="293.691" y1="102" x2="293.691" y2="394" class="chartlet-grid"/><text x="293.691" y="416" text-anchor="middle" class="chartlet-tick">1,000</text><line x1="387.697" y1="102" x2="387.697" y2="394" class="chartlet-grid"/><text x="387.697" y="416" text-anchor="middle" class="chartlet-tick">10,000</text><line x1="481.703" y1="102" x2="481.703" y2="394" class="chartlet-grid"/><text x="481.703" y=