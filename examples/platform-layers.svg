<svg xmlns="http://www.w3.org/2000/svg" width="860" height="408" viewBox="0 0 860 408" id="chartlet-8a8a959083eec2e0" role="img" aria-labelledby="chartlet-8a8a959083eec2e0-title chartlet-8a8a959083eec2e0-description" class="chartlet-root"><title id="chartlet-8a8a959083eec2e0-title">The layers of the platform, from the machine up</title><desc id="chartlet-8a8a959083eec2e0-description">Layer stack of 4 layers, from the bottom: 1 Infrastructure (items: Compute, Storage and Network; note: Rented from one provider; capacity is changed by the platform team only.); 2 Runtime and data (items: Containers, Message broker, Relational database and Object store); 3 Domain services (items: Orders, Catalog, Billing and Customers; note: One team per service; services talk only through published interfaces.); 4 Experience (items: Web shop, Mobile app and Partner API; note: The partner API is planned for next year.). Roles: critical: Domain services; planned: Experience.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-8a8a959083eec2e0 .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-8a8a959083eec2e0 .chartlet-label,#chartlet-8a8a959083eec2e0 .chartlet-tick,#chartlet-8a8a959083eec2e0 .chartlet-value,#chartlet-8a8a959083eec2e0 .chartlet-value-inverse,#chartlet-8a8a959083eec2e0 .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-8a8a959083eec2e0 .chartlet-value,#chartlet-8a8a959083eec2e0 .chartlet-value-inverse{font-weight:600}#chartlet-8a8a959083eec2e0 .chartlet-value{fill:var(--chartlet-text)}#chartlet-8a8a959083eec2e0 .chartlet-value-inverse{fill:var(--chartlet-background)}#chartle