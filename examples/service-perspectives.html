runs what</figcaption><div class="chartlet-stage"><svg xmlns="http://www.w3.org/2000/svg" width="1324" height="552" viewBox="0 0 1324 552" id="chartlet-b56804eaa07d6435" role="img" aria-labelledby="chartlet-b56804eaa07d6435-title chartlet-b56804eaa07d6435-description" class="chartlet-root"><title id="chartlet-b56804eaa07d6435-title">Booking platform: who runs what</title><desc id="chartlet-b56804eaa07d6435-description">Architecture diagram with 8 components and 7 connections in 2 boundaries. Cloud account: API gateway, Booking service, Pricing service, Data zone. Data zone (in Cloud account): Bookings, Legacy inventory. Most connected: Booking service (5 connections). Nothing leads into Guest. Bottleneck: API gateway; without it the diagram falls apart. Guest (person): connects to Booking app (books). Booking app (frontend): connects to API gateway (via HTTPS). API gateway (service): connects to Booking service (routes). Booking service (service): connects to Pricing service (asks price), Bookings (via SQL), Legacy inventory (checks rooms) and Payment provider (charges, via HTTPS). Pricing service (service): no outgoing connection. Bookings (database): no outgoing connection. Legacy inventory (database): no outgoing connection. Payment provider (external system): no outgoing connection. Perspective Team: Storefront: Booking app; Bookings: Booking service, Pricing service; Platform: API gateway, Bookings, Legacy inventory; not stated: Guest, Payment provider. The team named in the service catalogue runs each component.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-b56804eaa07d6435 .chartlet-title{font-size:22px;font-
