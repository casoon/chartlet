<svg xmlns="http://www.w3.org/2000/svg" width="900" height="592" viewBox="0 0 900 592" id="chartlet-76c636e55e0a3941" role="img" aria-labelledby="chartlet-76c636e55e0a3941-title chartlet-76c636e55e0a3941-description" class="chartlet-root"><title id="chartlet-76c636e55e0a3941-title">Checkout dependencies: the payment chain</title><desc id="chartlet-76c636e55e0a3941-description">Network with 8 nodes and 8 connections in 3 groups: Shop, Finance and Platform. In rings around Checkout: 1 step away: Cart, Pricing, Payments and Sign-in; 2 steps away: Fraud check and Ledger; 3 steps away: Event bus. Most connected: Checkout (4 connections). Nothing leads into Checkout. Bottleneck: Payments; without it the diagram falls apart. Checkout (group Shop): leads to Cart, Pricing, Payments and Sign-in. Cart (group Shop): no outgoing connection. Pricing (group Shop): no outgoing connection. Payments (group Finance): leads to Fraud check and Ledger. Sign-in (group Platform): no outgoing connection. Fraud check (group Finance): leads to Event bus. Ledger (group Finance): leads to Event bus. Event bus (group Platform): no outgoing connection. Emphasized: Payments. Emphasized path: Checkout → Payments → Ledger → Event bus. Legend: emphasized, solid line, dashed line, emphasized path.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-76c636e55e0a3941 .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-76c636e55e0a3941 .chartlet-label,#chartlet-76c636e55e0a3941 .chartlet-tick,#chartlet-76c636e55e0a3941 .chartlet-value,#chartlet-76c636e55e0a3941 .chartlet-value-inverse,#chartlet-76c636e55e0a3941 .chartlet-axis-tit