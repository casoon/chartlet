ccent)}#chartlet-d975c46f541e47d2 .chartlet-line{fill:none;stroke:var(--chartlet-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}#chartlet-d975c46f541e47d2 .chartlet-background{fill:var(--chartlet-background)}#chartlet-d975c46f541e47d2 .chartlet-legend{font-size:12px;fill:var(--chartlet-muted)}#chartlet-d975c46f541e47d2 .chartlet-series-1{fill:var(--chartlet-color-1)}#chartlet-d975c46f541e47d2 .chartlet-series-2{fill:var(--chartlet-color-2)}#chartlet-d975c46f541e47d2 .chartlet-series-3{fill:var(--chartlet-color-3)}#chartlet-d975c46f541e47d2 .chartlet-series-4{fill:var(--chartlet-color-4)}.chartlet-wrapper{display:inline-block;max-width:100%}.chartlet-filter{border:none;padding:0;margin:0 0 12px 0}.chartlet-filter legend{font-size:14px;font-weight:650;margin-bottom:4px}.chartlet-filter label{display:inline-flex;align-items:center;min-height:44px;font-size:13px;margin-right:14px;cursor:pointer;white-space:nowrap}.chartlet-filter input{margin-right:4px}.chartlet-filter input:focus-visible{outline:2px solid #2563eb;outline-offset:2px}.chartlet-wrapper:has(.chartlet-filter input.series-0:not(:checked)) .chartlet-root [data-series="0"]{display:none}.chartlet-wrapper:has(.chartlet-filter input.series-1:not(:checked)) .chartlet-root [data-series="1"]{display:none}.chartlet-wrapper:has(.chartlet-filter input.series-2:not(:checked)) .chartlet-root [data-series="2"]{display:none}.chartlet-wrapper:has(.chartlet-filter input.series-3:not(:checked)) .chartlet-root [data-series="3"]{display:none}#chartlet-d975c46f541e47d2 .chartlet-legend{font-size:12px;fill:var(--chartlet-muted)}#chartlet-d975c46f541e47d2 .chartlet-line-series-1{stroke:var(--chartlet-color-1)}#chartlet-d975c46f541e47d2 .chartlet-line-series-2{stroke:var(--chartlet-color-2)}#chartlet-d975c46f541e47d2 .chartlet-line-series-3{stroke:var(--chartlet-color-3)}#chartlet-d975c46f541e47d2 .chartlet-line-series-4{stroke:var(--chartlet-color-4)}#chartlet-d975c46f541e47d2 .chartlet-point-series-1{fill:var(-