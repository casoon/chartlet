<svg xmlns="http://www.w3.org/2000/svg" width="1184" height="520" viewBox="0 0 1184 520" id="chartlet-47dc90097e464989" role="img" aria-labelledby="chartlet-47dc90097e464989-title chartlet-47dc90097e464989-description" class="chartlet-root chartlet-theme-dark chartlet-blueprint"><title id="chartlet-47dc90097e464989-title">Web shop: deployment</title><desc id="chartlet-47dc90097e464989-description">Architecture diagram with 6 components and 5 connections in 3 boundaries. Production cluster: Load balancer, Node app-1, Node data-1. Node app-1 (in Production cluster): shop-api:2.4, order-worker:2.4. Node data-1 (in Production cluster): postgres:16, Data volume. Most connected: postgres:16 (3 connections). Nothing leads into Customer and order-worker:2.4. Nothing leads out of Data volume. Bottleneck: shop-api:2.4; without it the diagram falls apart. Customer (person): connects to Load balancer (via HTTPS). Load balancer (node): connects to shop-api:2.4 (via HTTP). shop-api:2.4 (artifact): connects to postgres:16 (via SQL/TLS). order-worker:2.4 (artifact): connects to postgres:16 (via SQL/TLS). postgres:16 (artifact): connects to Data volume (writes). Data volume (storage): no outgoing connection.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-47dc90097e464989 .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-47dc90097e464989 .chartlet-label,#chartlet-47dc90097e464989 .chartlet-tick,#chartlet-47dc90097e464989 .chartlet-value,#chartlet-47dc90097e464989 .chartlet-value-inverse,#chartlet-47dc90097e464989 .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-47dc90097e464989 