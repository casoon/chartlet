<svg xmlns="http://www.w3.org/2000/svg" width="820" height="580" viewBox="0 0 820 580" id="chartlet-8bcb4858a41fce1e" role="img" aria-labelledby="chartlet-8bcb4858a41fce1e-title chartlet-8bcb4858a41fce1e-description" class="chartlet-root"><title id="chartlet-8bcb4858a41fce1e-title">Requests per second between the services of a web shop</title><desc id="chartlet-8bcb4858a41fce1e-description">Architecture diagram with 8 components and 8 connections in 1 boundary. Cluster: API gateway, Catalog, Cart, Checkout, Search index, Orders. Main path: Web shop → API gateway → Checkout → Payment provider. Most connected: API gateway (4 connections). Nothing leads into Web shop. Nothing leads out of Search index, Orders and Payment provider. Bottleneck: API gateway; without it the diagram falls apart. Heaviest connection: Web shop → API gateway (1200). Web shop (frontend): connects to API gateway (1,200/s, weight 1200). API gateway (service): connects to Catalog (820/s, weight 820), Cart (310/s, weight 310) and Checkout (70/s, weight 70). Catalog (service): connects to Search index (640/s, weight 640). Cart (service): connects to Orders (150/s, weight 150). Checkout (service): connects to Orders (60/s, weight 60) and Payment provider (35/s, weight 35). Search index (database): no outgoing connection. Orders (database): no outgoing connection. Payment provider (external system): no outgoing connection.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-8bcb4858a41fce1e .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-8bcb4858a41fce1e .chartlet-label,#chartlet-8bcb4858a41fce1e .chartlet-tick,#chartlet-8