<svg xmlns="http://www.w3.org/2000/svg" width="360" height="668" viewBox="0 0 360 668" id="chartlet-df5df8d1e768d168-m" role="img" aria-labelledby="chartlet-df5df8d1e768d168-m-title chartlet-df5df8d1e768d168-m-description" class="chartlet-root"><title id="chartlet-df5df8d1e768d168-m-title">Life of a manuscript</title><desc id="chartlet-df5df8d1e768d168-m-description">State diagram with 5 states and 7 transitions. It starts in Draft. Final state: Published. Main path: Draft → Review – editor → Review – legal → Approved → Published. Draft to Review – editor on submit. Review – editor to itself on comment / reply. Review – editor to Draft on returned. Review – editor to Review – legal on accept. Review – legal to Review – editor on objection. Review – legal to Approved on clear. Approved to Published on release.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-df5df8d1e768d168-m .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-df5df8d1e768d168-m .chartlet-label,#chartlet-df5df8d1e768d168-m .chartlet-tick,#chartlet-df5df8d1e768d168-m .chartlet-value,#chartlet-df5df8d1e768d168-m .chartlet-value-inverse,#chartlet-df5df8d1e768d168-m .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-df5df8d1e768d168-m .chartlet-value,#chartlet-df5df8d1e768d168-m .chartlet-value-inverse{font-weight:600}#chartlet-df5df8d1e768d168-m .chartlet-value{fill:var(--chartlet-text)}#chartlet-df5df8d1e768d168-m .chartlet-value-inverse{fill:var(--chartlet-background)}#chartlet-df5df8d1e768d168-m .chartlet-axis-title{font-weight:600}#chartlet-df5df8d1e768d168-m .chartlet-grid{stroke:var(--chartlet-gri