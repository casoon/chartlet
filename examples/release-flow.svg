<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="980" viewBox="0 0 1120 980" id="chartlet-a00188928898889b" role="img" aria-labelledby="chartlet-a00188928898889b-title chartlet-a00188928898889b-description" class="chartlet-root"><title id="chartlet-a00188928898889b-title">From commit to release</title><desc id="chartlet-a00188928898889b-description">Flow chart with 10 steps and 11 connections in 3 lanes: Development, Continuous integration and Operations. Main path: Commit pushed → Code review → Build → Run tests → All green? → Deploy to staging → Approved? → Deploy to production → Released. Commit pushed (start) in Development: leads to Code review. Code review in Development: leads to Build (merged). Build in Continuous integration: leads to Run tests. Run tests in Continuous integration: leads to All green?. All green? (decision) in Continuous integration: leads to Deploy to staging (yes) and Fix failures (no). Fix failures in Development: leads to Build (retry). Deploy to staging in Operations: leads to Approved?. Approved? (decision) in Operations: leads to Deploy to production (yes) and Code review (changes requested). Deploy to production in Operations: leads to Released. Released (end) in Operations: no further step. Group &quot;Quality gates&quot;: Build, Run tests, All green?.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-a00188928898889b .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-a00188928898889b .chartlet-label,#chartlet-a00188928898889b .chartlet-tick,#chartlet-a00188928898889b .chartlet-value,#chartlet-a00188928898889b .chartlet-value-inverse,#chartlet-a00188928898889b .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-a00188928898889b .chartlet-value,#chartlet-a00188928898889b .chartlet-value-inverse{font-weight:600}#chartlet-a00188928898889b .chartlet-value{fill:var(--chartlet-text)}#chartlet-a00188928898889b .chartlet-value-inverse{fill:var(--chartlet-background)}#chartlet-a00188928898889b .chartlet-axis-title{font-weight:600}#chartlet-a00188928898889b .chartlet-grid{stroke:var(--chartlet-grid);stroke-width:1}#chartlet-a00188928898889b .chartlet-zero{stroke:var(--chartlet-zero);stroke-width:1.5}#chartlet-a00188928898889b .chartlet-bar,#chartlet-a00188928898889b .chartlet-point{fill:var(--chartlet-accent)}#chartlet-a00188928898889b .chartlet-line{fill:none;stroke:var(--chartlet-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}#chartlet-a00188928898889b .chartlet-background{fill:var(--chartlet-background)}.chartlet-root{--chartlet-node:#eef3fd;--chartlet-lane:#f6f8fc}.chartlet-root.chartlet-theme-dark{--chartlet-node:#1a2436;--chartlet-lane:#131a26}#chartlet-a00188928898889b .chartlet-flow-node{fill:var(--chartlet-node);stroke:var(--chartlet-accent);stroke-width:1.5;stroke-linejoin:round;rx:5px}#chartlet-a00188928898889b .chartlet-flow-start{stroke-width:2}#chartlet-a00188928898889b .chartlet-flow-end{stroke-width:3}#chartlet-a00188928898889b .chartlet-flow-external{fill:var(--chartlet-background);stroke:var(--chartlet-muted);stroke-dasharray:5 3}#chartlet-a00188928898889b .chartlet-flow-inner{stroke:var(--chartlet-accent);stroke-width:1}#chartlet-a00188928898889b .chartlet-flow-rim{fill:none;stroke:var(--chartlet-accent);stroke-width:1.5}#chartlet-a00188928898889b .chartlet-flow-label{font-size:13px;font-weight:600;fill:var(--chartlet-text)}#chartlet-a00188928898889b .chartlet-flow-sublabel{font-size:11px;fill:var(--chartlet-muted)}#chartlet-a00188928898889b .chartlet-flow-edge{fill:none;stroke:var(--chartlet-muted);stroke-width:1.5;stroke-linejoin:round}#chartlet-a00188928898889b .chartlet-flow-dashed{stroke-dasharray:6 4}#chartlet-a00188928898889b .chartlet-flow-dotted{stroke-dasharray:1 4;stroke-linecap:round}#chartlet-a00188928898889b .chartlet-flow-main{stroke:var(--chartlet-accent);stroke-width:2.5}#chartlet-a00188928898889b .chartlet-flow-head{fill:var(--chartlet-muted);stroke:var(--chartlet-muted);stroke-width:1;stroke-linejoin:round}#chartlet-a00188928898889b .chartlet-flow-main-head{fill:var(--chartlet-accent);stroke:var(--chartlet-accent)}#chartlet-a00188928898889b .chartlet-flow-edge-label{font-size:12px;fill:var(--chartlet-text);paint-order:stroke;stroke:var(--chartlet-background);stroke-width:3px;stroke-linejoin:round}#chartlet-a00188928898889b .chartlet-flow-lane{fill:var(--chartlet-lane);stroke:var(--chartlet-grid);stroke-width:1}#chartlet-a00188928898889b .chartlet-flow-lane-alt{fill:var(--chartlet-background)}#chartlet-a00188928898889b .chartlet-flow-lane-label{font-size:11px;font-weight:650;fill:var(--chartlet-muted);letter-spacing:.04em}#chartlet-a00188928898889b .chartlet-flow-group{fill:none;stroke:var(--chartlet-zero);stroke-width:1;stroke-dasharray:4 3;rx:8px}#chartlet-a00188928898889b .chartlet-flow-group-label{font-size:11px;font-weight:600;fill:var(--chartlet-muted)}</style><text x="24" y="30" text-anchor="start" class="chartlet-title">From commit to release</text><rect x="24" y="56" width="335.597" height="908" class="chartlet-flow-lane"/><text x="191.798" y="73" text-anchor="middle" class="chartlet-flow-lane-label">Development</text><rect x="359.597" y="56" width="365.187" height="908" class="chartlet-flow-lane chartlet-flow-lane-alt"/><text x="542.19" y="73" text-anchor="middle" class="chartlet-flow-lane-label">Continuous integration</text><rect x="724.783" y="56" width="371.217" height="908" class="chartlet-flow-lane"/><text x="910.392" y="73" text-anchor="middle" class="chartlet-flow-lane-label">Operations</text><rect x="430.19" y="264.085" width="176" height="281.002" class="chartlet-flow-group"/><te