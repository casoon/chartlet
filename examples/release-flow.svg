<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1064" viewBox="0 0 1120 1064" id="chartlet-d2ca0c5a6e69ce63" role="img" aria-labelledby="chartlet-d2ca0c5a6e69ce63-title chartlet-d2ca0c5a6e69ce63-description" class="chartlet-root"><title id="chartlet-d2ca0c5a6e69ce63-title">From commit to release</title><desc id="chartlet-d2ca0c5a6e69ce63-description">Flow chart with 10 steps and 11 connections in 3 lanes: Development, Continuous integration and Operations. Main path: Commit pushed → Code review → Build → Run tests → All green? → Deploy to staging → Approved? → Deploy to production → Released. Loop: Code review → Build → Run tests → All green? → Deploy to staging → Approved? → Code review. Bottleneck: Approved?; without it the diagram falls apart. Commit pushed (start) in Development: leads to Code review. Code review in Development: leads to Build (merged). Build in Continuous integration: leads to Run tests. Run tests in Continuous integration: leads to All green?. All green? (decision) in Continuous integration: leads to Deploy to staging (yes) and Fix failures (no). Fix failures in Development: leads to Build (retry). Deploy to staging in Operations: leads to Approved?. Approved? (decision) in Operations: leads to Deploy to production (yes) and Code review (changes requested). Deploy to production in Operations: leads to Released. Released (end) in Operations: no further step. Group &quot;Quality gates&quot;: Build, Run tests, All green?.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-d2ca0c5a6e69ce63 .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-d2ca0c5a6e69ce63 .