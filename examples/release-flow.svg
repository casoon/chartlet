ow-external{stroke-dasharray:5 3}#chartlet-d2ca0c5a6e69ce63 .chartlet-flow-inner{stroke:var(--chartlet-role-blue);stroke-width:1}#chartlet-d2ca0c5a6e69ce63 .chartlet-flow-label{font-size:13px;font-weight:600;fill:var(--chartlet-text)}#chartlet-d2ca0c5a6e69ce63 .chartlet-flow-sublabel{font-size:11px;fill:var(--chartlet-muted)}#chartlet-d2ca0c5a6e69ce63 .chartlet-flow-edge{fill:none;stroke:var(--chartlet-zero);stroke-width:1.4;stroke-linejoin:round}#chartlet-d2ca0c5a6e69ce63 .chartlet-flow-dashed{stroke-dasharray:5 4}#chartlet-d2ca0c5a6e69ce63 .chartlet-flow-dotted{stroke-dasharray:1 4;stroke-linecap:round}#chartlet-d2ca0c5a6e69ce63 .chartlet-flow-main{stroke:var(--chartlet-accent);stroke-width:2.2}#chartlet-d2ca0c5a6e69ce63 .chartlet-flow-head{fill:var(--chartlet-zero);stroke:var(--chartlet-zero);stroke-width:1;stroke-linejoin:round}#chartlet-d2ca0c5a6e69ce63 .chartlet-flow-main-head{fill:var(--chartlet-accent);stroke:var(--chartlet-accent)}#chartlet-d2ca0c5a6e69ce63 .chartlet-flow-lane{fill:var(--chartlet-lane);stroke:var(--chartlet-grid);stroke-width:1}#chartlet-d2ca0c5a6e69ce63 .chartlet-flow-lane-alt{fill:var(--chartlet-background)}#chartlet-d2ca0c5a6e69ce63 .chartlet-flow-lane-head{fill:var(--chartlet-lane-head);stroke:none}#chartlet-d2ca0c5a6e69ce63 .chartlet-flow-lane-label{font-size:11px;font-weight:650;fill:var(--chartlet-muted);letter-spacing:.04em}#chartlet-d2ca0c5a6e69ce63 .chartlet-flow-group{fill:var(--chartlet-accent);fill-opacity:.04;stroke:var(--chartlet-zero);stroke-width:1;stroke-dasharray:4 3;rx:10px}#chartlet-d2ca0c5a6e69ce63 .chartlet-flow-group-label{font-size:11px;font-weight:600;fill:var(--chartlet-muted)}</style><text x="24" y="30" text-anchor="start" class="chartlet-title">From commit to release</text><rect x="24" y="56" width="336" height="992" class="chartlet-flow-lane"/><rect x="24.5" y="56.5" width="335" height="27" class="chartlet-flow-lane-head"/><text x="192" y="73" text-anchor="middle" class="chartlet-flow-lane-label">Development</text><rect x="360" y="56" width="360" height="992" class="chartlet-flow-lane chartlet-flow-lane-alt"/><rect x="360.5" y="56.5" width="359" height="27" class="chartlet-flow-lane-head"/><text x="540" y="73" text-anchor="middle" class="chartlet-flow-lane-label">Continuous integration</text><rect x="720" y="56" width="368" height="992" class="chartlet-flow-lane"/><rect x="720.5" y="56.5" width="367" height="27" class="chartlet-flow-lane-head"/><text x="904" y="73" text-anchor="middle" class="chartlet-flow-lane-label">Operations</text><rect x="428" y="292" width="176" height="280" class="chartlet-flow-group"/><text x="436" y="305" text-anchor="start" class="chartlet-flow-group-label">Quality gates</text><g class="chartlet-f chartlet-f-0 chartlet-f-1"><polyline points="192,140 192,160" class="chartlet-flow-edge chartlet-flow-main"><title>Commit pushed → Code review</title></polyline><polyline points="188.5,160 192,168 195.5,160 188.5,160" class="chartlet-flow-head chartlet-flow-main-head"/></g><g class="chartlet-f chartlet-f-1 chartlet-f-2"><polyline points="192,208 192,265 516,265 516,312" class="chartlet-flow-edge chartlet-flow-main"><title>Code review → Build: merged</title></polyline><polyline points="512.5,312 516,320 519.5,312 512.5,312" class="chartlet-flow-head chartlet-flow-main-head"/></g><g class="chartlet-f chartlet-f-2 chartlet-f-3"><polyline points="516,376 516,408" class="chartlet-flow-edge chartlet-flow-main"><title>Build → Run tests</title></polyline><polyline points="512.5,408 516,416 519.5,408 512.5,408" class="chartlet-flow-head chartlet-flow-main-head"/></g><g class="chartlet-f chartlet-f-3 chartlet-f-4"><polyline points="516,456 516,488" class="chartlet-flow-edge chartlet-flow-main"><title>Run tests → All green?</title></polyline><polyline points="512.5,488 516,496 519.5,488 512.5,488" class="chartlet-flow-head chartlet-flow-main-head"/></g><g class="chartlet-f chartlet-f-4 chartlet-f-6"><polyline points="516,560 516,629 896,629 896,680" class="chartl