<svg xmlns="http://www.w3.org/2000/svg" width="380" height="900" viewBox="0 0 380 900" id="chartlet-b10260382e2f3797-m" role="img" aria-labelledby="chartlet-b10260382e2f3797-m-title chartlet-b10260382e2f3797-m-description" class="chartlet-root"><title id="chartlet-b10260382e2f3797-m-title">Story map of an online shop</title><desc id="chartlet-b10260382e2f3797-m-description">Story map of 3 activities, 6 tasks and 12 stories in 3 releases. Find a product: Browse the catalog (MVP: List products by category; Release 2: Filter by price); Search (MVP: Search by name; Later: Suggest while typing). Buy it: Fill the cart (MVP: Add and remove items; Release 2: Save the cart for later); Pay (MVP: Pay by card; Release 2: Pay by invoice; Later: Split the payment). Receive it: Follow the order (MVP: Confirmation email; Release 2: Tracking page); Return an item (Release 2: Return label by email).</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-b10260382e2f3797-m .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-b10260382e2f3797-m .chartlet-label,#chartlet-b10260382e2f3797-m .chartlet-tick,#chartlet-b10260382e2f3797-m .chartlet-value,#chartlet-b10260382e2f3797-m .chartlet-value-inverse,#chartlet-b10260382e2f3797-m .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-b10260382e2f3797-m .chartlet-value,#chartlet-b10260382e2f3797-m .chartlet-value-inverse{font-weight:600}#chartlet-b10260382e2f3797-m .chartlet-value{fill:var(--chartlet-text)}#chartlet-b10260382e2f3797-m .chartlet-value-inverse{fill:var(--chartlet-background)}#chartlet-b10260382e2f3797-m .chartlet-axis-title{font-weight:600}#chartlet-b10260382e2f3797-m .chartlet-grid{stroke:var(--chartlet-grid);stroke-width:1}#chartlet-b10260382e2f3797-m .chartlet-zero{stroke:var(--chartlet-zero);stroke-width:1.5}#chartlet-b10260382e2f3797-m .chartlet-bar,#chartlet-b10260382e2f3797-m .chartlet-point{fill:var(--chartlet-accent)}#chartlet-b10260382e2f3797-m .chartlet-line{fill:none;stroke:var(--chartlet-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}#chartlet-b10260382e2f3797-m .chartlet-background{fill:var(--chartlet-background)}#chartlet-b10260382e2f3797-m .chartlet-story-activity{fill:var(--chartlet-role-blue-fill);stroke:var(--chartlet-role-blue);stroke-width:1.5;rx:6px}#chartlet-b10260382e2f3797-m .chartlet-story-activity-text{font-size:12px;font-weight:700;fill:var(--chartlet-text)}#chartlet-b10260382e2f3797-m .chartlet-story-task{fill:var(--chartlet-role-teal-fill);stroke:var(--chartlet-role-teal);stroke-width:1.5;rx:6px}#chartlet-b10260382e2f3797-m .chartlet-story-task-text{font-size:12px;font-weight:600;fill:var(--chartlet-text)}#chartlet-b10260382e2f3797-m .chartlet-story-card{fill:var(--chartlet-background);stroke:var(--chartlet-grid);stroke-width:1;rx:5px}#chartlet-b10260382e2f3797-m .chartlet-story-card-text{font-size:12px;fill:var(--chartlet-text)}#chartlet-b10260382e2f3797-m .chartlet-story-cut{stroke:var(--chartlet-zero);stroke-width:1.2;stroke-dasharray:6 4}#chartlet-b10260382e2f3797-m .chartlet-story-release{font-size:12px;font-weight:700;fill:var(--chartlet-muted)}#chartlet-b10260382e2f3797-m .chartlet-title-small{font-size:18px}.chartlet-root{--chartlet-node:#eef3fd;--chartlet-lane:#f7f9fc;--chartlet-lane-head:#eef1f6;--chartlet-shadow:rgba(16,24,40,.09);--chartlet-role-blue:#2563eb;--chartlet-role-blue-fill:#eef3fd;--chartlet-role-green:#15803d;--chartlet-role-green-fill:#ecfdf3;--chartlet-role-amber:#b45309;--chartlet-role-amber-fill:#fff7e8;--chartlet-role-teal:#0f766e;--chartlet-role-teal-fill:#e9faf7;--chartlet-role-violet:#6d28d9;--chartlet-role-violet-fi