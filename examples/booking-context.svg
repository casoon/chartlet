<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" id="chartlet-9727cba18ffc3248" role="img" aria-labelledby="chartlet-9727cba18ffc3248-title chartlet-9727cba18ffc3248-description" class="chartlet-root"><title id="chartlet-9727cba18ffc3248-title">Course booking: system context</title><desc id="chartlet-9727cba18ffc3248-description">Architecture diagram with 6 components and 5 connections. Main path: Learner → Course booking → Payment provider. Most connected: Course booking (5 connections). Nothing leads into Learner and Trainer. Nothing leads out of Payment provider, E-mail service and Staff directory. Learner (person): connects to Course booking (books a course). Trainer (person): connects to Course booking (plans dates). Course booking (service): connects to Payment provider (takes payment), E-mail service (sends confirmations) and Staff directory (looks up trainers). Payment provider (external system): no outgoing connection. E-mail service (external system): no outgoing connection. Staff directory (external system): no outgoing connection.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-9727cba18ffc3248 .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-9727cba18ffc3248 .chartlet-label,#chartlet-9727cba18ffc3248 .chartlet-tick,#chartlet-9727cba18ffc3248 .chartlet-value,#chartlet-9727cba18ffc3248 .chartlet-value-inverse,#chartlet-9727cba18ffc3248 .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-9727cba18ffc3248 .chartlet-value,#chartlet-9727cba18ffc3248 .chartlet-value-inverse{font-weight:600}#chartlet-9727cba18ffc3248 .cha