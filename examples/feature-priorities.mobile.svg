tlet-grid{stroke:var(--chartlet-grid);stroke-width:1}#chartlet-a41c0f286e41d878-m .chartlet-zero{stroke:var(--chartlet-zero);stroke-width:1.5}#chartlet-a41c0f286e41d878-m .chartlet-bar,#chartlet-a41c0f286e41d878-m .chartlet-point{fill:var(--chartlet-accent)}#chartlet-a41c0f286e41d878-m .chartlet-line{fill:none;stroke:var(--chartlet-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}#chartlet-a41c0f286e41d878-m .chartlet-background{fill:var(--chartlet-background)}#chartlet-a41c0f286e41d878-m .chartlet-sc-1{fill:var(--chartlet-color-1)}#chartlet-a41c0f286e41d878-m .chartlet-sc-2{fill:var(--chartlet-color-2)}#chartlet-a41c0f286e41d878-m .chartlet-sc-3{fill:var(--chartlet-color-3)}#chartlet-a41c0f286e41d878-m .chartlet-sc-4{fill:var(--chartlet-color-4)}#chartlet-a41c0f286e41d878-m .chartlet-sc-dot{fill-opacity:.65;stroke:none}#chartlet-a41c0f286e41d878-m .chartlet-sc-swatch{stroke:none;rx:5px}#chartlet-a41c0f286e41d878-m .chartlet-sc-fit{stroke-width:2;fill:none}#chartlet-a41c0f286e41d878-m .chartlet-sc-fit.chartlet-sc-1{stroke:var(--chartlet-color-1)}#chartlet-a41c0f286e41d878-m .chartlet-sc-fit.chartlet-sc-2{stroke:var(--chartlet-color-2)}#chartlet-a41c0f286e41d878-m .chartlet-sc-fit.chartlet-sc-3{stroke:var(--chartlet-color-3)}#chartlet-a41c0f286e41d878-m .chartlet-sc-fit.chartlet-sc-4{stroke:var(--chartlet-color-4)}#chartlet-a41c0f286e41d878-m .chartlet-sc-line{stroke:var(--chartlet-zero);stroke-width:1.5;stroke-dasharray:5 4}#chartlet-a41c0f286e41d878-m .chartlet-sc-label{font-size:11px;font-weight:600;fill:var(--chartlet-text);paint-order:stroke;stroke:var(--chartlet-background);stroke-width:3px;stroke-linejoin:round}#chartlet-a41c0f286e41d878-m .chartlet-legend{font-size:12px;fill:var(--chartlet-muted)}#chartlet-a41c0f286e41d878-m .chartlet-title-small{font-size:18px}</style><text x="72" y="30" text-anchor="start" class="chartlet-title chartlet-title-small">Feature priorities: impact</text><text x="72" y="58" text-anchor="start" class="chartlet-tit