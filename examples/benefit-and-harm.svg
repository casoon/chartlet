e{fill:none;stroke:var(--chartlet-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}#chartlet-900c7e78de68b71a .chartlet-background{fill:var(--chartlet-background)}#chartlet-900c7e78de68b71a .chartlet-legend{font-size:12px;fill:var(--chartlet-muted)}#chartlet-900c7e78de68b71a .chartlet-series-1{fill:var(--chartlet-color-1)}#chartlet-900c7e78de68b71a .chartlet-series-2{fill:var(--chartlet-color-2)}#chartlet-900c7e78de68b71a .chartlet-series-3{fill:var(--chartlet-color-3)}#chartlet-900c7e78de68b71a .chartlet-series-4{fill:var(--chartlet-color-4)}.chartlet-wrapper{display:inline-block;max-width:100%}.chartlet-filter{border:none;padding:0;margin:0 0 12px 0}.chartlet-filter legend{font-size:14px;font-weight:650;margin-bottom:4px}.chartlet-filter label{display:inline-flex;align-items:center;min-height:44px;font-size:13px;margin-right:14px;cursor:pointer;white-space:nowrap}.chartlet-filter input{margin-right:4px}.chartlet-filter input:focus-visible{outline:2px solid #2563eb;outline-offset:2px}.chartlet-wrapper:has(.chartlet-filter input.series-0:not(:checked)) .chartlet-root [data-series="0"]{display:none}.chartlet-wrapper:has(.chartlet-filter input.series-1:not(:checked)) .chartlet-root [data-series="1"]{display:none}.chartlet-wrapper:has(.chartlet-filter input.series-2:not(:checked)) .chartlet-root [data-series="2"]{display:none}.chartlet-wrapper:has(.chartlet-filter input.series-3:not(:checked)) .chartlet-root [data-series="3"]{display:none}</style><text x="152.44" y="30" text-anchor="start" class="chartlet-title">Effects of an evening without a phone</text><line x1="152.44" y1="102" x2="152.44" y2="284" class="chartlet-zero"/><text x="152.44" y="306" text-anchor="middle" class="chartlet-tick">0</text><line x1="252.352" y1="102" x2="252.352" y2="284" class="chartlet-grid"/><text x="252.352" y="306" text-anchor="middle" class="chartlet-tick">1</text><line x1="352.264" y1="102" x2="352.264" y2="284" class="chartlet-grid"/><text x="352.264" y="306" text-anc