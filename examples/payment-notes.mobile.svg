></polyline><polyline points="120,1053 121.227,1054.294 124.823,1055.5 130.544,1056.536 138,1057.33 146.683,1057.83 156,1058 165.317,1057.83 174,1057.33 181.456,1056.536 187.177,1055.5 190.773,1054.294 192,1053" class="chartlet-diagram-rim"/><text x="156" y="1079.5" text-anchor="middle" class="chartlet-flow-label">Ledger</text></g><g class="chartlet-f chartlet-n-6 chartlet-f-3 chartlet-f-6"><rect x="160" y="1154.5" width="120" height="40" class="chartlet-diagram-shadow"/><rect x="160" y="1152" width="120" height="40" class="chartlet-flow-node chartlet-flow-external chartlet-role-gray"><title>Card provider</title></rect><text x="220" y="1176.5" text-anchor="middle" class="chartlet-flow-label">Card provider</text></g><g class="chartlet-f chartlet-n-7 chartlet-f-4 chartlet-f-7"><polyline points="36,880 146,880 156,890 156,976 36,976 36,880" class="chartlet-flow-node chartlet-role-amber"><title>Card numbers never leave the vault; everything else sees tokens.</title></polyline><polyline points="146,880 146,890 156,890" class="chartlet-flow-node chartlet-role-amber"/><text x="48" y="899" text-anchor="start" class="chartlet-diagram-chip-text">Card numbers</text><text x="48" y="914" text-anchor="start" class="chartlet-diagram-chip-text">never leave the</text><text x="48" y="929" text-anchor="start" class="chartlet-diagram-chip-text">vault;</text><text x="48" y="944" text-anchor="start" class="chartlet-diagram-chip-text">everything else</text><text x="48" y="959" text-anchor="start" class="chartlet-diagram-chip-text">sees tokens.</text></g><g class="chartlet-f chartlet-n-8 chartlet-f-8"><polyline points="292,536 394,536 404,546 404,616 292,616 292,536" class="chartlet-flow-node chartlet-role-amber"><title>Audited once a year; changes need a second reviewer.</title></polyline><polyline points="394,536 394,546 404,546" class="chartlet-flow-node chartlet-role-amber"/><text x="304" y="555" text-anchor="start" class="chartlet-diagram-chip-text">Audited once a</text><text x="304" 