cent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}#chartlet-36a5fad95253f52a .chartlet-background{fill:var(--chartlet-background)}#chartlet-36a5fad95253f52a .chartlet-error{stroke:var(--chartlet-text);stroke-width:1.5;stroke-linecap:round}</style><text x="72" y="30" text-anchor="start" class="chartlet-title">Mean satisfaction by month, with 95 % confidence</text><text x="72" y="58" text-anchor="start" class="chartlet-title">interval</text><line x1="72" y1="318" x2="696" y2="318" class="chartlet-grid"/><text x="62" y="322" text-anchor="end" class="chartlet-tick">2.5</text><line x1="72" y1="275.6" x2="696" y2="275.6" class="chartlet-grid"/><text x="62" y="279.6" text-anchor="end" class="chartlet-tick">3.0</text><line x1="72" y1="233.2" x2="696" y2="233.2" class="chartlet-grid"/><text x="62" y="237.2" text-anchor="end" class="chartlet-tick">3.5</text><line x1="72" y1="190.8" x2="696" y2="190.8" class="chartlet-grid"/><text x="62" y="194.8" text-anchor="end" class="chartlet-tick">4.0</text><line x1="72" y1="148.4" x2="696" y2="148.4" class="chartlet-grid"/><text x="62" y="152.4" text-anchor="end" class="chartlet-tick">4.5</text><line x1="72" y1="106" x2="696" y2="106" class="chartlet-grid"/><text x="62" y="110" text-anchor="end" class="chartlet-tick">5.0</text><text x="72" y="86" text-anchor="start" class="chartlet-axis-title">Score from 1 to 5</text><line x1="78" y1="301.04" x2="78" y2="233.2" class="chartlet-error"/><line x1="75" y1="301.04" x2="81" y2="301.04" class="chartlet-error"/><line x1="75" y1="233.2" x2="81" y2="233.2" class="chartlet-error"/><circle cx="78" cy="267.12" r="4" class="chartlet-point"><title>Jan: 3.1 (2.7 to 3.5)</title></circle><text x="78" y="223.2" text-anchor="middle" class="chartlet-value">3.1</text><text x="78" y="342" text-anchor="middle" class="chartlet-label">Jan</text><line x1="200.4" y1="275.6" x2="200.4" y2="199.28" class="chartlet-error"/><line x1="197.4" y1="275.6" x2="203.4" y2="275.6" class="chartlet-error"/><line x