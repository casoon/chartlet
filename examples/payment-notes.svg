let-title">Payments and what to know about them</text><rect x="172" y="340" width="652" height="716" class="chartlet-flow-group"/><text x="180" y="353" text-anchor="start" class="chartlet-flow-group-label">Cloud account</text><rect x="184" y="500" width="628" height="436" class="chartlet-flow-group"/><text x="192" y="513" text-anchor="start" class="chartlet-flow-group-label">Card data zone</text><g class="chartlet-f chartlet-f-0 chartlet-f-1"><polyline points="488,116 488,192" class="chartlet-flow-edge chartlet-flow-main"><title>Shopper → Checkout: pays</title></polyline><polyline points="484.5,192 488,200 491.5,192 484.5,192" class="chartlet-flow-head chartlet-flow-main-head"/></g><g class="chartlet-f chartlet-f-1 chartlet-f-2"><polyline points="488,248 488,360" class="chartlet-flow-edge chartlet-flow-main"><title>Checkout → API gateway: [HTTPS]</title></polyline><polyline points="484.5,360 488,368 491.5,360 484.5,360" class="chartlet-flow-head chartlet-flow-main-head"/></g><g class="chartlet-f chartlet-f-2 chartlet-f-3"><polyline points="488,408 488,524" class="chartlet-flow-edge chartlet-flow-main"><title>API gateway → Payment service: charge</title></polyline><polyline points="484.5,524 488,532 491.5,524 484.5,524" class="chartlet-flow-head chartlet-flow-main-head"/></g><g class="chartlet-f chartlet-f-3 chartlet-f-4"><polyline points="440,572 440,694.317 340,694.317 340,740" class="chartlet-flow-edge"><title>Payment service → Token vault: tokenizes</title></polyline><polyline points="336.5,740 340,748 343.5,740 336.5,740" class="chartlet-flow-head"/></g><g class="chartlet-f chartlet-f-3 chartlet-f-6"><polyline points="488,572 488,1092" class="chartlet-flow-edge chartlet-flow-main"><title>Payment service → Card provider: authorizes [HTTPS]</title></polyline><polyline points="484.5,1092 488,1100 491.5,1092 484.5,1092" class="chartlet-flow-head chartlet-flow-main-head"/></g><g class="chartlet-f chartlet-f-3 chartlet-f-5"><polyline points="464,572 464,711.22 440,711