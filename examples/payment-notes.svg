nd{stroke-width:3}#chartlet-d5472d7361b74f66 .chartlet-flow-external{stroke-dasharray:5 3}#chartlet-d5472d7361b74f66 .chartlet-flow-inner{stroke:var(--chartlet-role-blue);stroke-width:1}#chartlet-d5472d7361b74f66 .chartlet-flow-label{font-size:13px;font-weight:600;fill:var(--chartlet-text)}#chartlet-d5472d7361b74f66 .chartlet-flow-sublabel{font-size:11px;fill:var(--chartlet-muted)}#chartlet-d5472d7361b74f66 .chartlet-flow-edge{fill:none;stroke:var(--chartlet-zero);stroke-width:1.4;stroke-linejoin:round}#chartlet-d5472d7361b74f66 .chartlet-flow-dashed{stroke-dasharray:5 4}#chartlet-d5472d7361b74f66 .chartlet-flow-dotted{stroke-dasharray:1 4;stroke-linecap:round}#chartlet-d5472d7361b74f66 .chartlet-flow-main{stroke:var(--chartlet-accent);stroke-width:2.2}#chartlet-d5472d7361b74f66 .chartlet-flow-head{fill:var(--chartlet-zero);stroke:var(--chartlet-zero);stroke-width:1;stroke-linejoin:round}#chartlet-d5472d7361b74f66 .chartlet-flow-main-head{fill:var(--chartlet-accent);stroke:var(--chartlet-accent)}#chartlet-d5472d7361b74f66 .chartlet-flow-lane{fill:var(--chartlet-lane);stroke:var(--chartlet-grid);stroke-width:1}#chartlet-d5472d7361b74f66 .chartlet-flow-lane-alt{fill:var(--chartlet-background)}#chartlet-d5472d7361b74f66 .chartlet-flow-lane-head{fill:var(--chartlet-lane-head);stroke:none}#chartlet-d5472d7361b74f66 .chartlet-flow-lane-label{font-size:11px;font-weight:650;fill:var(--chartlet-muted);letter-spacing:.04em}#chartlet-d5472d7361b74f66 .chartlet-flow-group{fill:var(--chartlet-accent);fill-opacity:.04;stroke:var(--chartlet-zero);stroke-width:1;stroke-dasharray:4 3;rx:10px}#chartlet-d5472d7361b74f66 .chartlet-flow-group-label{font-size:11px;font-weight:600;fill:var(--chartlet-muted)}#chartlet-d5472d7361b74f66 .chartlet-arch-head{fill:var(--chartlet-role-violet-fill);stroke:var(--chartlet-role-violet);stroke-width:1.5}#chartlet-d5472d7361b74f66 .chartlet-arch-dot{fill:var(--chartlet-role-blue);stroke:none}</style><text x="24" y="30" text-anchor="start" class="chartlet-title">Payments and what to know about them</text><rect x="172" y="328" width="652" height="688" class="chartlet-flow-group"/><text x="180" y="341" text-anchor="start" class="chartlet-flow-group-label">Cloud account</text><rect x="184" y="480" width="628" height="420" class="chartlet-flow-group"/><text x="192" y="493" text-anchor="start" class="chartlet-flow-group-label">Card data zone</text><g class="chartlet-f chartlet-f-0 chartlet-f-1"><polyline points="488,120 488,188" class="chartlet-flow-edge chartlet-flow-main"><title>Shopper → Checkout: pays</title></polyline><polyline points="484.5,188 488,196 491.5,188 484.5,188" class="chartlet-flow-head chartlet-flow-main-head"/></g><g class="chartlet-f chartlet-f-1 chartlet-f-2"><polyline points="488,244 488,348" class="chartlet-flow-edge chartlet-flow-main"><title>Checkout → API gateway: [HTTPS]</title></polyline><polyline points="484.5,348 488,356 491.5,348 484.5,348" class="chartlet-flow-head chartlet-flow-main-head"/></g><g class="chartlet-f chartlet-f-2 chartlet-f-3"><polyline points="488,396 488,504" class="chartlet-flow-edge chartlet-flow-main"><title>API gateway → Payment service: charge</title></polyline><polyline points="484.5,504 488,512 491.5,504 484.5,504" class="chartlet-flow-head chartlet-flow-main-head"/></g><g class="chartlet-f chartlet-f-3 chartlet-f-4"><polyline points="440,552 440,666.634 340,666.634 340,708" class="chartlet-flow-edge"><title>Payment service → Token vault: tokenizes</title></polyline><polyline points="336.5,708 340,716 343.5,708 336.5,708" class="chartlet-flow-head"/></g><g class="chartlet-f chartlet-f-3 chartlet-f-6"><polyline points="488,552 488,1048" class="chartlet-flow-edge chartlet-flow-main"><title>Payment service → Card provider: authorizes [HTTPS]</title></polyline><polyline points="484.5,1048 488,1056 491.5,1048 484.5,1048" class="chartlet-flow-head chartlet-flow-main-head"/></g><g class="chartlet-f chartlet-f-3 chartlet-f-5"><polyline points="464,552 464,682.439 440,68