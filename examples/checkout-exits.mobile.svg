<svg xmlns="http://www.w3.org/2000/svg" width="360" height="708" viewBox="0 0 360 708" id="chartlet-f7a608d0e3e9600b-m" role="img" aria-labelledby="chartlet-f7a608d0e3e9600b-m-title chartlet-f7a608d0e3e9600b-m-description" class="chartlet-root"><title id="chartlet-f7a608d0e3e9600b-m-title">Checkout with its exits</title><desc id="chartlet-f7a608d0e3e9600b-m-description">Flow chart with 7 steps and 9 connections. Main path: Cart → Delivery address → Shipping method → Payment → Confirm order → Order placed. Most connected: Checkout abandoned (4 connections). Cart (start): leads to Delivery address. Delivery address: leads to Shipping method and Checkout abandoned (no route). Shipping method: leads to Payment and Checkout abandoned. Payment: leads to Confirm order (authorised) and Checkout abandoned. Confirm order: leads to Order placed and Checkout abandoned (timeout). Order placed (end): no further step. Checkout abandoned (end): no further step.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-f7a608d0e3e9600b-m .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-f7a608d0e3e9600b-m .chartlet-label,#chartlet-f7a608d0e3e9600b-m .chartlet-tick,#chartlet-f7a608d0e3e9600b-m .chartlet-value,#chartlet-f7a608d0e3e9600b-m .chartlet-value-inverse,#chartlet-f7a608d0e3e9600b-m .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-f7a608d0e3e9600b-m .chartlet-value,#chartlet-f7a608d0e3e9600b-m .chartlet-value-inverse{font-weight:600}#chartlet-f7a608d0e3e9600b-m .chartlet-value{fill:var(--chartlet-text)}#chartlet-f7a608d0e3e9600b-m .chartlet-value-inverse{fill:var(--chartlet-backgrou