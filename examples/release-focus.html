ion) in Continuous integration: leads to Deploy to staging (yes) and Fix failures (no). Fix failures in Development: leads to Build (retry). Deploy to staging in Operations: leads to Approved?. Approved? (decision) in Operations: leads to Deploy to production (yes) and Code review (changes requested). Deploy to production in Operations: leads to Released. Released (end) in Operations: no further step. Group &quot;Quality gates&quot;: Build, Run tests, All green?. Emphasized: All green?. Emphasized path: Build → Run tests → All green? → Deploy to staging. Legend: start, end, step, decision, emphasized, solid line, dashed line, emphasized path.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-d13bc95ed4c499e1-m .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-d13bc95ed4c499e1-m .chartlet-label,#chartlet-d13bc95ed4c499e1-m .chartlet-tick,#chartlet-d13bc95ed4c499e1-m .chartlet-value,#chartlet-d13bc95ed4c499e1-m .chartlet-value-inverse,#chartlet-d13bc95ed4c499e1-m .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-d13bc95ed4c499e1-m .chartlet-value,#chartlet-d13bc95ed4c499e1-m .chartlet-value-inverse{font-weight:600}#chartlet-d13bc95ed4c499e1-m .chartlet-value{fill:var(--chartlet-text)}#chartlet-d13bc95ed4c499e1-m .chartlet-value-inverse{fill:var(--chartlet-background)}#chartlet-d13bc95ed4c499e1-m .chartlet-axis-title{font-weight:600}#chartlet-d13bc95ed4c499e1-m .chartlet-grid{stroke:var(--chartlet-grid);stroke-width:1}#chartlet-d13bc95ed4c499e1-m .chartlet-zero{stroke:var(--chartlet-zero);stroke-width:1.5}#chartlet-d13bc95ed4c499e1-m .chartlet-bar,#chartlet-d13bc95ed4
