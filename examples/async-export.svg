<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="400" viewBox="0 0 1160 400" id="chartlet-06d27c713c2d61dc" role="img" aria-labelledby="chartlet-06d27c713c2d61dc-title chartlet-06d27c713c2d61dc-description" class="chartlet-root"><title id="chartlet-06d27c713c2d61dc-title">Exporting a report in the background</title><desc id="chartlet-06d27c713c2d61dc-description">Sequence diagram with 5 participants: Browser (actor), Export API, Jobs (queue), Worker and File storage (external). 10 messages, in order: 1. Browser to Export API: POST /exports. 2. Export API to Jobs: enqueue (asynchronous). 3. Export API to Browser: 202, job id (reply). 4. Worker to Jobs: take job. 5. Worker to File storage: write report. 6. Browser to Export API: GET /exports/7. 7. Export API to Browser: running (reply). 8. Worker to Export API: done (asynchronous). 9. Browser to Export API: GET /exports/7. 10. Export API to Browser: download link (reply). Fragment loop &quot;every 5 s&quot; spans messages 6–7.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-06d27c713c2d61dc .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-06d27c713c2d61dc .chartlet-label,#chartlet-06d27c713c2d61dc .chartlet-tick,#chartlet-06d27c713c2d61dc .chartlet-value,#chartlet-06d27c713c2d61dc .chartlet-value-inverse,#chartlet-06d27c713c2d61dc .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-06d27c713c2d61dc .chartlet-value,#chartlet-06d27c713c2d61dc .chartlet-value-inverse{font-weight:600}#chartlet-06d27c713c2d61dc .chartlet-value{fill:var(--chartlet-text)}#chartlet-06d27c713c2d61dc .chartlet-value-inverse{fill:v