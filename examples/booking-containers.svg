<svg xmlns="http://www.w3.org/2000/svg" width="800" height="960" viewBox="0 0 800 960" id="chartlet-0cad13a20646171f" role="img" aria-labelledby="chartlet-0cad13a20646171f-title chartlet-0cad13a20646171f-description" class="chartlet-root"><title id="chartlet-0cad13a20646171f-title">Course booking: containers</title><desc id="chartlet-0cad13a20646171f-description">Architecture diagram with 9 components and 8 connections in 1 boundary. Course booking (software system): Web app, Booking API, Job queue, Worker, Bookings, Certificates. Main path: Learner → Web app → Booking API → Bookings. Most connected: Booking API (4 connections). Nothing leads into Learner. Bottlenecks: Booking API and Job queue; without either the diagram falls apart. Learner (person): connects to Web app (books a course, via HTTPS). Web app (frontend): connects to Booking API (calls, via JSON/HTTPS). Booking API (service): connects to Bookings (reads, writes, via SQL), Payment provider (takes payment, via HTTPS) and Job queue (queues jobs). Job queue (queue): connects to Worker (delivers). Bookings (database): no outgoing connection. Payment provider (external system): no outgoing connection. Worker (service): connects to Certificates (stores certificates) and E-mail service (sends confirmations, via SMTP). Certificates (storage): no outgoing connection. E-mail service (external system): no outgoing connection.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-0cad13a20646171f .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-0cad13a20646171f .chartlet-label,#chartlet-0cad13a20646171f .chartlet-tick,#chartlet-0cad13a20646171f .chartlet-value,#chartlet-0cad13a20646171f .chartlet-value-inverse,#chartlet-0cad13a20646171f .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-0cad13a20646171f .chartlet-value,#chartlet-0cad13a20646171f .chartlet-value-inverse{font-weight:600}#chartlet-0cad13a20646171f .chartlet-value{fill:var(--chartlet-text)}#chartlet-0cad13a20646171f .chartlet-value-inverse{fill:var(--chartlet-background)}#chartlet-0cad13a20646171f .chartlet-axis-title{font-weight:600}#chartlet-0cad13a20646171f .chartlet-grid{stroke:var(--chartlet-grid);stroke-width:1}#chartlet-0cad13a20646171f .chartlet-zero{stroke:var(--chartlet-zero);stroke-width:1.5}#chartlet-0cad13a20646171f .chartlet-bar,#chartlet-0cad13a20646171f .chartlet-point{fill:var(--chartlet-accent)}#chartlet-0cad13a20646171f .chartlet-line{fill:none;stroke:var(--chartlet-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}#chartlet-0cad13a20646171f .chartlet-background{fill:var(--chartlet-background)}.chartlet-root{--chartlet-node:#eef3fd;--chartlet-lane:#f7f9fc;--chartlet-lane-head:#eef1f6;--chartlet-shadow:rgba(16,24,40,.09);--chartlet-role-blue:#2563eb;--chartlet-role-blue-fill:#eef3fd;--chartlet-role-green:#15803d;--chartlet-role-green-fill:#ecfdf3;--chartlet-role-amber:#b45309;--chartlet-role-amber-fill:#fff7e8;--chartlet-role-teal:#0f766e;--chartlet-role-teal-fill:#e9faf7;--chartlet-role-violet:#6d28d9;--chartlet-role-violet-fill:#f3efff;--chartlet-role-gray:#667085;--chartlet-role-gray-fill:#f7f8fa;--chartlet-role-red:#b42318;--chartlet-role-red-fill:#fef3f2}.chartlet-root.chartlet-theme-dark{--chartlet-node:#1a2436;--chartlet-lane:#121925;--chartlet-lane-head:#18212f;--chartlet-shadow:rgba(0,0,0,.45);--chartlet-role-blue:#7ea6ff;--chartlet-role-blue-fill:#1a2436;--chartlet-role-green:#4ade80;--chartlet-role-green-fill:#132a1d;--chartlet-role-amber:#fbbf24;--chartlet-role-amber-fill:#2b2210;--chartlet-role-teal:#2dd4bf;--chartlet-role-teal-fill:#0f2a27;--chartlet-role-violet:#b69c