<svg xmlns="http://www.w3.org/2000/svg" width="800" height="940" viewBox="0 0 800 940" id="chartlet-0cad13a20646171f" role="img" aria-labelledby="chartlet-0cad13a20646171f-title chartlet-0cad13a20646171f-description" class="chartlet-root"><title id="chartlet-0cad13a20646171f-title">Course booking: containers</title><desc id="chartlet-0cad13a20646171f-description">Architecture diagram with 9 components and 8 connections in 1 boundary. Course booking (software system): Web app, Booking API, Job queue, Worker, Bookings, Certificates. Main path: Learner → Web app → Booking API → Bookings. Most connected: Booking API (4 connections). Nothing leads into Learner. Bottlenecks: Booking API and Job queue; without either the diagram falls apart. Learner (person): connects to Web app (books a course, via HTTPS). Web app (frontend): connects to Booking API (calls, via JSON/HTTPS). Booking API (service): connects to Bookings (reads, writes, via SQL), Payment provider (takes payment, via HTTPS) and Job queue (queues jobs). Job queue (queue): connects to Worker (delivers). Bookings (database): no outgoing connection. Payment provider (external system): no outgoing connection. Worker (service): connects to Certificates (stores certificates) and E-mail service (sends confirmations, via SMTP). Certificates (storage): no outgoing connection. E-mail service (external system): no outgoing connection.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-0cad13a20646171f .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-0cad13a20646171f .chartlet-label,#chartlet-0cad13a20646171f .chartlet-tick,#chartlet-0cad13a206