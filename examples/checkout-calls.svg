l:#161d29;--chartlet-role-red:#f97066;--chartlet-role-red-fill:#2d1616}#chartlet-19dc1aa622594b84 .chartlet-role-blue{fill:var(--chartlet-role-blue-fill);stroke:var(--chartlet-role-blue)}#chartlet-19dc1aa622594b84 .chartlet-role-green{fill:var(--chartlet-role-green-fill);stroke:var(--chartlet-role-green)}#chartlet-19dc1aa622594b84 .chartlet-role-amber{fill:var(--chartlet-role-amber-fill);stroke:var(--chartlet-role-amber)}#chartlet-19dc1aa622594b84 .chartlet-role-teal{fill:var(--chartlet-role-teal-fill);stroke:var(--chartlet-role-teal)}#chartlet-19dc1aa622594b84 .chartlet-role-violet{fill:var(--chartlet-role-violet-fill);stroke:var(--chartlet-role-violet)}#chartlet-19dc1aa622594b84 .chartlet-role-gray{fill:var(--chartlet-role-gray-fill);stroke:var(--chartlet-role-gray)}#chartlet-19dc1aa622594b84 .chartlet-role-red{fill:var(--chartlet-role-red-fill);stroke:var(--chartlet-role-red)}#chartlet-19dc1aa622594b84 .chartlet-diagram-rim{fill:none;stroke:var(--chartlet-role-teal);stroke-width:1.5}#chartlet-19dc1aa622594b84 .chartlet-diagram-shadow{fill:var(--chartlet-shadow);stroke:none;rx:7px}#chartlet-19dc1aa622594b84 .chartlet-diagram-chip{fill:var(--chartlet-background);stroke:var(--chartlet-grid);stroke-width:1;rx:4px}#chartlet-19dc1aa622594b84 .chartlet-diagram-chip-text{font-size:12px;fill:var(--chartlet-text)}#chartlet-19dc1aa622594b84 .chartlet-diagram-badge{fill:var(--chartlet-accent);stroke:var(--chartlet-background);stroke-width:2}#chartlet-19dc1aa622594b84 .chartlet-diagram-badge-text{font-size:10px;font-weight:700;fill:var(--chartlet-background)}#chartlet-19dc1aa622594b84 .chartlet-flow-node{stroke-width:1.5;stroke-linejoin:round;rx:7px}#chartlet-19dc1aa622594b84 .chartlet-flow-start{stroke-width:2}#chartlet-19dc1aa622594b84 .chartlet-flow-end{stroke-width:3}#chartlet-19dc1aa622594b84 .chartlet-flow-external{stroke-dasharray:5 3}#chartlet-19dc1aa622594b84 .chartlet-flow-inner{stroke:var(--chartlet-role-blue);stroke-width:1}#chartlet-19dc1aa622594b84 .chartlet-flo