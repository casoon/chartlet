itle></polyline><polyline points="464.5,196 468,204 471.5,196 464.5,196" class="chartlet-flow-head chartlet-flow-main-head"/></g><g class="chartlet-f chartlet-f-1 chartlet-f-2"><polyline points="468,252 468,356" class="chartlet-flow-edge chartlet-flow-main"><title>Web shop → Shop API: 2. places the order [HTTPS]</title></polyline><polyline points="464.5,356 468,364 471.5,356 464.5,356" class="chartlet-flow-head chartlet-flow-main-head"/></g><g class="chartlet-f chartlet-f-2 chartlet-f-3"><polyline points="444,404 444,531.355 316,531.355 316,568" class="chartlet-flow-edge"><title>Shop API → Payment provider: 3. charges [HTTPS]</title></polyline><polyline points="312.5,568 316,576 319.5,568 312.5,568" class="chartlet-flow-head"/></g><g class="chartlet-f chartlet-f-2 chartlet-f-4"><polyline points="468,404 468,564" class="chartlet-flow-edge chartlet-flow-main"><title>Shop API → Orders: 4. stores the order [SQL]</title></polyline><polyline points="464.5,564 468,572 471.5,564 464.5,564" class="chartlet-flow-head chartlet-flow-main-head"/></g><g class="chartlet-f chartlet-f-2 chartlet-f-5"><polyline points="492,404 492,531.355 600,531.355 600,568" class="chartlet-flow-edge chartlet-flow-dashed"><title>Shop API → Mail service: 5. sends the receipt</title></polyline><polyline points="596.5,568 600,576 603.5,568 596.5,568" class="chartlet-flow-head"/></g><g class="chartlet-f chartlet-n-0 chartlet-f-0 chartlet-f-1"></g><g class="chartlet-f chartlet-n-1 chartlet-f-0 chartlet-f-1 chartlet-f-2"></g><g class="chartlet-f chartlet-n-2 chartlet-f-1 chartlet-f-2 chartlet-f-3 chartlet-f-4 chartlet-f-5"></g><g class="chartlet-f chartlet-n-3 chartlet-f-2 chartlet-f-3"></g><g class="chartlet-f chartlet-n-4 chartlet-f-2 chartlet-f-4"></g><g class="chartlet-f chartlet-n-5 chartlet-f-2 chartlet-f-5"></g><g class="chartlet-f chartlet-f-0 chartlet-f-1"><rect x="472" y="121" width="130.48" height="21" class="chartlet-diagram-chip"/><text x="477" y="135" text-anchor="start" class="chartlet-diag