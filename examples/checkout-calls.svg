l:#161d29;--chartlet-role-red:#f97066;--chartlet-role-red-fill:#2d1616}#chartlet-19dc1aa622594b84 .chartlet-role-blue{fill:var(--chartlet-role-blue-fill);stroke:var(--chartlet-role-blue)}#chartlet-19dc1aa622594b84 .chartlet-role-green{fill:var(--chartlet-role-green-fill);stroke:var(--chartlet-role-green)}#chartlet-19dc1aa622594b84 .chartlet-role-amber{fill:var(--chartlet-role-amber-fill);stroke:var(--chartlet-role-amber)}#chartlet-19dc1aa622594b84 .chartlet-role-teal{fill:var(--chartlet-role-teal-fill);stroke:var(--chartlet-role-teal)}#chartlet-19dc1aa622594b84 .chartlet-role-violet{fill:var(--chartlet-role-violet-fill);stroke:var(--chartlet-role-violet)}#chartlet-19dc1aa622594b84 .chartlet-role-gray{fill:var(--chartlet-role-gray-fill);stroke:var(--chartlet-role-gray)}#chartlet-19dc1aa622594b84 .chartlet-role-red{fill:var(--chartlet-role-red-fill);stroke:var(--chartlet-role-red)}#chartlet-19dc1aa622594b84 .chartlet-diagram-rim{fill:none;stroke:var(--chartlet-role-teal);stroke-width:1.5}#chartlet-19dc1aa622594b84 .chartlet-diagram-shadow{fill:var(--chartlet-shadow);stroke:none;rx:7px}#chartlet-19dc1aa622594b84 .chartlet-diagram-chip{fill:var(--chartlet-background);stroke:var(--chartlet-grid);stroke-width:1;rx:4px}#chartlet-19dc1aa622594b84 .chartlet-diagram-chip-text{font-size:12px;fill:var(--chartlet-text)}#chartlet-19dc1aa622594b84 .chartlet-diagram-badge{fill:var(--chartlet-accent);stroke:var(--chartlet-background);stroke-width:2}#chartlet-19dc1aa622594b84 .chartlet-diagram-badge-text{font-size:10px;font-weight:700;fill:var(--chartlet-background)}#chartlet-19dc1aa622594b84 .chartlet-flow-node{stroke-width:1.5;stroke-linejoin:round;rx:7px}#chartlet-19dc1aa622594b84 .chartlet-flow-start{stroke-width:2}#chartlet-19dc1aa622594b84 .chartlet-flow-end{stroke-width:3}#chartlet-19dc1aa622594b84 .chartlet-flow-external{stroke-dasharray:5 3}#chartlet-19dc1aa622594b84 .chartlet-flow-inner{stroke:var(--chartlet-role-blue);stroke-width:1}#chartlet-19dc1aa622594b84 .chartlet-flow-label{font-size:13px;font-weight:600;fill:var(--chartlet-text)}#chartlet-19dc1aa622594b84 .chartlet-flow-sublabel{font-size:11px;fill:var(--chartlet-muted)}#chartlet-19dc1aa622594b84 .chartlet-flow-edge{fill:none;stroke:var(--chartlet-zero);stroke-width:1.4;stroke-linejoin:round}#chartlet-19dc1aa622594b84 .chartlet-flow-dashed{stroke-dasharray:5 4}#chartlet-19dc1aa622594b84 .chartlet-flow-dotted{stroke-dasharray:1 4;stroke-linecap:round}#chartlet-19dc1aa622594b84 .chartlet-flow-main{stroke:var(--chartlet-accent);stroke-width:2.2}#chartlet-19dc1aa622594b84 .chartlet-flow-head{fill:var(--chartlet-zero);stroke:var(--chartlet-zero);stroke-width:1;stroke-linejoin:round}#chartlet-19dc1aa622594b84 .chartlet-flow-main-head{fill:var(--chartlet-accent);stroke:var(--chartlet-accent)}#chartlet-19dc1aa622594b84 .chartlet-flow-lane{fill:var(--chartlet-lane);stroke:var(--chartlet-grid);stroke-width:1}#chartlet-19dc1aa622594b84 .chartlet-flow-lane-alt{fill:var(--chartlet-background)}#chartlet-19dc1aa622594b84 .chartlet-flow-lane-head{fill:var(--chartlet-lane-head);stroke:none}#chartlet-19dc1aa622594b84 .chartlet-flow-lane-label{font-size:11px;font-weight:650;fill:var(--chartlet-muted);letter-spacing:.04em}#chartlet-19dc1aa622594b84 .chartlet-flow-group{fill:var(--chartlet-accent);fill-opacity:.04;stroke:var(--chartlet-zero);stroke-width:1;stroke-dasharray:4 3;rx:10px}#chartlet-19dc1aa622594b84 .chartlet-flow-group-label{font-size:11px;font-weight:600;fill:var(--chartlet-muted)}#chartlet-19dc1aa622594b84 .chartlet-arch-head{fill:var(--chartlet-role-violet-fill);stroke:var(--chartlet-role-violet);stroke-width:1.5}#chartlet-19dc1aa622594b84 .chartlet-arch-dot{fill:var(--chartlet-role-blue);stroke:none}</style><text x="24" y="30" text-anchor="start" class="chartlet-title">Checkout: the calls in order</text><g class="chartlet-f chartlet-f-0 chartlet-f-1"><polyline points="467.915,110 467.915,196.008" class="chartlet-flow-edge chartlet-flow-main"><title>Customer → Web shop: 1. confirms