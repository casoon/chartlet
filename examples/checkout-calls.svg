<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" id="chartlet-19dc1aa622594b84" role="img" aria-labelledby="chartlet-19dc1aa622594b84-title chartlet-19dc1aa622594b84-description" class="chartlet-root"><title id="chartlet-19dc1aa622594b84-title">Checkout: the calls in order</title><desc id="chartlet-19dc1aa622594b84-description">Architecture diagram with 6 components and 5 connections. Main path: Customer → Web shop → Shop API → Orders. Most connected: Shop API (4 connections). Nothing leads into Customer. Nothing leads out of Payment provider, Orders and Mail service. Steps: 1 Customer → Web shop (confirms the cart); 2 Web shop → Shop API (places the order); 3 Shop API → Payment provider (charges); 4 Shop API → Orders (stores the order); 5 Shop API → Mail service (sends the receipt). Customer (person): connects to Web shop (step 1, confirms the cart). Web shop (frontend): connects to Shop API (step 2, places the order, via HTTPS). Shop API (service): connects to Payment provider (step 3, charges, via HTTPS), Orders (step 4, stores the order, via SQL) and Mail service (step 5, sends the receipt). Payment provider (external system): no outgoing connection. Orders (database): no outgoing connection. Mail service (external system): no outgoing connection.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-19dc1aa622594b84 .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-19dc1aa622594b84 .chartlet-label,#chartlet-19dc1aa622594b84 .chartlet-tick,#chartlet-19dc1aa622594b84 .chartlet-value,#chartlet-19dc1aa622594b84 .chartlet-value-inverse,#chartlet-19dc1aa6