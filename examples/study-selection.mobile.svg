<svg xmlns="http://www.w3.org/2000/svg" width="440" height="960" viewBox="0 0 440 960" id="chartlet-35fa11b3ac14dae5-m" role="img" aria-labelledby="chartlet-35fa11b3ac14dae5-m-title chartlet-35fa11b3ac14dae5-m-description" class="chartlet-root"><title id="chartlet-35fa11b3ac14dae5-m-title">Study selection (PRISMA 2020)</title><desc id="chartlet-35fa11b3ac14dae5-m-description">Flow chart with 10 steps and 9 connections. Main path: Records from databases → Duplicates removed → Records screened → Reports sought → Reports assessed → Studies included. Nothing leads into Records from databases and Records from registers. Nothing leads out of Records excluded, Reports not retrieved and Reports excluded. Bottlenecks: Records screened and Reports sought; without either the diagram falls apart. Records from databases (input or output): leads to Duplicates removed. Records from registers (input or output): leads to Duplicates removed. Duplicates removed (external): leads to Records screened. Records screened: leads to Records excluded and Reports sought. Records excluded (external): no further step. Reports sought: leads to Reports not retrieved and Reports assessed. Reports not retrieved (external): no further step. Reports assessed: leads to Reports excluded and Studies included. Reports excluded (external): no further step. Studies included (end): no further step. Group &quot;Identification&quot;: Records from databases, Records from registers, Duplicates removed. Group &quot;Screening&quot;: Records screened, Records excluded, Reports sought, Reports not retrieved, Reports assessed, Reports excluded. Group &quot;Included&quot;: Studies included.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui