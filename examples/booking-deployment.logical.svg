hartlet-role-blue-fill);stroke:var(--chartlet-role-blue)}#chartlet-1342fe7dec2f1424 .chartlet-role-green{fill:var(--chartlet-role-green-fill);stroke:var(--chartlet-role-green)}#chartlet-1342fe7dec2f1424 .chartlet-role-amber{fill:var(--chartlet-role-amber-fill);stroke:var(--chartlet-role-amber)}#chartlet-1342fe7dec2f1424 .chartlet-role-teal{fill:var(--chartlet-role-teal-fill);stroke:var(--chartlet-role-teal)}#chartlet-1342fe7dec2f1424 .chartlet-role-violet{fill:var(--chartlet-role-violet-fill);stroke:var(--chartlet-role-violet)}#chartlet-1342fe7dec2f1424 .chartlet-role-gray{fill:var(--chartlet-role-gray-fill);stroke:var(--chartlet-role-gray)}#chartlet-1342fe7dec2f1424 .chartlet-role-red{fill:var(--chartlet-role-red-fill);stroke:var(--chartlet-role-red)}#chartlet-1342fe7dec2f1424 .chartlet-diagram-rim{fill:none;stroke:var(--chartlet-role-teal);stroke-width:1.5}#chartlet-1342fe7dec2f1424 .chartlet-diagram-shadow{fill:var(--chartlet-shadow);stroke:none;rx:7px}#chartlet-1342fe7dec2f1424 .chartlet-diagram-chip{fill:var(--chartlet-background);stroke:var(--chartlet-grid);stroke-width:1;rx:4px}#chartlet-1342fe7dec2f1424 .chartlet-diagram-chip-text{font-size:12px;fill:var(--chartlet-text)}#chartlet-1342fe7dec2f1424 .chartlet-diagram-badge{fill:var(--chartlet-accent);stroke:var(--chartlet-background);stroke-width:2}#chartlet-1342fe7dec2f1424 .chartlet-diagram-badge-text{font-size:10px;font-weight:700;fill:var(--chartlet-background)}#chartlet-1342fe7dec2f1424 .chartlet-flow-node{stroke-width:1.5;stroke-linejoin:round;rx:7px}#chartlet-1342fe7dec2f1424 .chartlet-flow-start{stroke-width:2}#chartlet-1342fe7dec2f1424 .chartlet-flow-end{stroke-width:3}#chartlet-1342fe7dec2f1424 .chartlet-flow-external{stroke-dasharray:5 3}#chartlet-1342fe7dec2f1424 .chartlet-flow-inner{stroke:var(--chartlet-role-blue);stroke-width:1}#chartlet-1342fe7dec2f1424 .chartlet-flow-label{font-size:13px;font-weight:600;fill:var(--chartlet-text)}#chartlet-1342fe7dec2f1424 .chartlet-flow-sublabel{font-size:11px