<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" id="chartlet-1342fe7dec2f1424" role="img" aria-labelledby="chartlet-1342fe7dec2f1424-title chartlet-1342fe7dec2f1424-description" class="chartlet-root"><title id="chartlet-1342fe7dec2f1424-title">Course booking: deployable parts</title><desc id="chartlet-1342fe7dec2f1424-description">Architecture diagram with 7 components and 7 connections. Main path: Learner → Ingress → Booking API → Job queue → Worker → Certificates. Most connected: Booking API and Worker (3 connections each). Nothing leads into Learner. Nothing leads out of Bookings and Certificates. Bottleneck: Booking API; without it the diagram falls apart. Learner (person): connects to Ingress (opens, via HTTPS). Ingress (service): connects to Booking API (routes, via HTTP). Booking API (artifact): connects to Bookings (reads, writes, via SQL/TLS) and Job queue (queues jobs). Job queue (queue): connects to Worker (delivers). Worker (artifact): connects to Certificates (stores certificates) and Bookings (updates, via SQL/TLS). Certificates (storage): no outgoing connection. Bookings (database): no outgoing connection.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-1342fe7dec2f1424 .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-1342fe7dec2f1424 .chartlet-label,#chartlet-1342fe7dec2f1424 .chartlet-tick,#chartlet-1342fe7dec2f1424 .chartlet-value,#chartlet-1342fe7dec2f1424 .chartlet-value-inverse,#chartlet-1342fe7dec2f1424 .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-1342fe7dec2f1424 .chartlet-value,#chartlet-1342f