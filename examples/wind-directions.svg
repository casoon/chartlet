<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" id="chartlet-31d98cccd9ac7a0a" role="img" aria-labelledby="chartlet-31d98cccd9ac7a0a-title chartlet-31d98cccd9ac7a0a-description" class="chartlet-root"><title id="chartlet-31d98cccd9ac7a0a-title">Wind by direction</title><desc id="chartlet-31d98cccd9ac7a0a-description">Polar chart of 8 categories, from the top clockwise: N, NE, E, SE, S, SW, W, NW. Highest: SW (24); lowest: N (6). Percent of hours runs from 0 at the center to 24 at the outer ring.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-31d98cccd9ac7a0a .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-31d98cccd9ac7a0a .chartlet-label,#chartlet-31d98cccd9ac7a0a .chartlet-tick,#chartlet-31d98cccd9ac7a0a .chartlet-value,#chartlet-31d98cccd9ac7a0a .chartlet-value-inverse,#chartlet-31d98cccd9ac7a0a .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-31d98cccd9ac7a0a .chartlet-value,#chartlet-31d98cccd9ac7a0a .chartlet-value-inverse{font-weight:600}#chartlet-31d98cccd9ac7a0a .chartlet-value{fill:var(--chartlet-text)}#chartlet-31d98cccd9ac7a0a .chartlet-value-inverse{fill:var(--chartlet-background)}#chartlet-31d98cccd9ac7a0a .chartlet-axis-title{font-weight:600}#chartlet-31d98cccd9ac7a0a .chartlet-grid{stroke:var(--chartlet-grid);stroke-width:1}#chartlet-31d98cccd9ac7a0a .chartlet-zero{stroke:var(--chartlet-zero);stroke-width:1.5}#chartlet-31d98cccd9ac7a0a .chartlet-bar,#chartlet-31d98cccd9ac7a0a .chartlet-point{fill:var(--chartlet-accent)}#chartlet-31d98cccd9ac7a0a .chartlet-line{fill:none;stroke:var(--chartlet-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}#chartlet-31d98cccd9ac7a0a .chartlet-background{fill:var(--chartlet-background)}#chartlet-31d98cccd9ac7a0a .chartlet-polar-ring{fill:none;stroke:var(--chartlet-grid);stroke-width:1}#chartlet-31d98cccd9ac7a0a .chartlet-polar-bar{fill:var(--chartlet-color-1);stroke:none}#chartlet-31d98cccd9ac7a0a .chartlet-polar-stem{stroke:var(--chartlet-color-1);stroke-width:2}#chartlet-31d98cccd9ac7a0a .chartlet-polar-dot{fill:var(--chartlet-color-1);stroke:var(--chartlet-background);stroke-width:1.5}#chartlet-31d98cccd9ac7a0a .chartlet-polar-tick{font-size:11px;fill:var(--chartlet-muted);paint-order:stroke;stroke:var(--chartlet-background);stroke-width:3px;stroke-linejoin:round}</style><text x="24" y="30" text-anchor="start" class="chartlet-title">Wind by direction</text><circle cx="320" cy="262" r="46.5" class="chartlet-polar-ring"/><circle cx="320" cy="262" r="93" class="chartlet-polar-ring"/><circle cx="320" cy="262" r="139.5" class="chartlet-polar-ring"/><circle cx="320" cy="262" r="186" class="chartlet-polar-ring"/><line x1="320" y1="262" x2="320" y2="215.5" class="chartlet-polar-stem"/><circle cx="320" cy="215.5" r="4.5" class="chartlet-polar-dot"><title>N: 6</title></circle><line x1="320" y1="262" x2="369.321" y2="212.679" class="chartlet-polar-stem"/><circle cx="369.321" cy="212.679" r="4.5" class="chartlet-polar-dot"><title>NE: 9</title></circle><line x1="320" y1="262" x2="382" y2="262" class="chartlet-polar-stem"/><circle cx="382" cy="262" r="4.5" class="chartlet-polar-dot"><title>E: 8</title></circle><line x1="320" y1="262" x2="358.361" y2="300.361" class="chartlet-polar-stem"/><circle cx="358.361" cy="300.361" r="4.5" class="chartlet-polar-dot"><title>SE: 7</title></circle><line x1="320" y1="262" x2="320" y2="347.25" class="chartlet-polar-stem"/><circle cx="320" cy="347.25" r="4.5" class="chartlet-polar-dot"><title>S: 11</title></circle><line x1="320" y1="262" x2="188.478" y2="393.522" class="chartlet-polar-stem"/><circle cx="188.478" cy="393.522" r="4.5" class="chartlet-polar-dot"><title>SW: 24</title></circle><line x1="320" y1="262" x2="157.25" y2="262" class="chartlet-polar-stem"/><circle cx="157.25" cy="262" r="4.5" class="chartlet-polar-dot"><title>W: 21</title></circle><line x1="320" y1="262" x2="243.279" y2="185.279" class="chartlet-polar-stem"/><circle cx="243.279" cy="185.279" r="4.5" class="chartlet-polar-dot"><title>NW: 14</title></circle><text x="324" y="212.5" text-anchor="start" class="chartlet-polar-tick">6</text><text x="324" y="166" text-anchor="start" class="chartlet-polar-tick">12</text><text x="324" y="119.5" text-anchor="start" class="chartlet-polar-tick">18</text><text x="324" y="73" text-anchor="start" class="chartlet-polar-tick">24</text><text x="320" y="58" text-anchor="middle" class="chartlet-label">N</text><text x="458.593" y="121.407" text-anchor="start" class="chartlet-label">NE</text><text x="516" y="266" text-anchor="start" class="chartlet-label">E</text><text x="458.593" y="410.593" text-anchor="start" class="chartlet-label">SE</text><text x="320" y="468" text-anchor="middle" class="chartlet-label">S</text><text x="181.407" y="410.593" text-anchor="end" class="chartlet-label">SW</text><text x="124" y="266" text-anchor="end" class="chartlet-label">W</text><text x="181.407" y="121.407" text-anchor="end" class="chartlet-label">NW</text></svg>