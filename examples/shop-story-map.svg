<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" id="chartlet-b10260382e2f3797" role="img" aria-labelledby="chartlet-b10260382e2f3797-title chartlet-b10260382e2f3797-description" class="chartlet-root"><title id="chartlet-b10260382e2f3797-title">Story map of an online shop</title><desc id="chartlet-b10260382e2f3797-description">Story map of 3 activities, 6 tasks and 12 stories in 3 releases. Find a product: Browse the catalog (MVP: List products by category; Release 2: Filter by price); Search (MVP: Search by name; Later: Suggest while typing). Buy it: Fill the cart (MVP: Add and remove items; Release 2: Save the cart for later); Pay (MVP: Pay by card; Release 2: Pay by invoice; Later: Split the payment). Receive it: Follow the order (MVP: Confirmation email; Release 2: Tracking page); Return an item (Release 2: Return label by email).</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-b10260382e2f3797 .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-b10260382e2f3797 .chartlet-label,#chartlet-b10260382e2f3797 .chartlet-tick,#chartlet-b10260382e2f3797 .chartlet-value,#chartlet-b10260382e2f3797 .chartlet-value-inverse,#chartlet-b10260382e2f3797 .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-b10260382e2f3797 .chartlet-value,#chartlet-b10260382e2f3797 .chartlet-value-inverse{font-weight:600}#chartlet-b10260382e2f3797 .chartlet-value{fill:var(--chartlet-text)}#chartlet-b10260382e2f3797 .chartlet-value-inverse{fill:var(--chartlet-background)}#chartlet-b10260382e2f3797 .chartlet-axis-title{font-weight:600}#chartlet-b10260382e2f3797 