<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="540" viewBox="0 0 1900 540" id="chartlet-6eb2843d93367fb7" role="img" aria-labelledby="chartlet-6eb2843d93367fb7-title chartlet-6eb2843d93367fb7-description" class="chartlet-root"><title id="chartlet-6eb2843d93367fb7-title">Web shop: overview</title><desc id="chartlet-6eb2843d93367fb7-description">Architecture diagram with 8 components and 8 connections in 3 boundaries. It is a view that shows 8 of the model&#39;s 11 components and 8 of its 11 connections. Cloud region eu-central-1: Invoices, Private network. Private network (in Cloud region eu-central-1): Shop API, Order events, Order worker, Data zone. Data zone (in Private network): Orders. Main path: Customer → Web shop → Shop API → Order events → Order worker → Payment provider. Most connected: Order worker (4 connections). Nothing leads into Customer. Nothing leads out of Orders, Invoices and Payment provider. Bottleneck: Shop API; without it the diagram falls apart. Customer (person): connects to Web shop (browses). Web shop (frontend): connects to Shop API (calls, via HTTPS/JSON). Shop API (service): connects to Orders (reads, writes, via SQL/TLS) and Order events (publishes, via AMQP). Order events (queue): connects to Order worker (delivers). Order worker (service): connects to Payment provider (charges, via HTTPS), Invoices (stores PDF, via S3 API) and Orders (updates, via SQL/TLS). Orders (database): no outgoing connection. Invoices (storage): no outgoing connection. Payment provider (external system): no outgoing connection.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-6eb2843d93367fb7 .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-6eb2843d93367fb7 .chartlet-label,#chartlet-6eb2843d93367fb7 .chartlet-tick,#chartlet-6eb2843d93367fb7 .chartlet-value,#chartlet-6eb2843d93367fb7 .chartlet-value-inverse,#chartlet-6eb2843d93367fb7 .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-6eb2843d93367fb7 .chartlet-value,#chartlet-6eb2843d93367fb7 .chartlet-value-inverse{font-weight:600}#chartlet-6eb2843d93367fb7 .chartlet-value{fill:var(--chartlet-text)}#chartlet-6eb2843d93367fb7 .chartlet-value-inverse{fill:var(--chartlet-background)}#chartlet-6eb2843d93367fb7 .chartlet-axis-title{font-weight:600}#chartlet-6eb2843d93367fb7 .chartlet-grid{stroke:var(--chartlet-grid);stroke-width:1}#chartlet-6eb2843d93367fb7 .chartlet-zero{stroke:var(--chartlet-zero);stroke-width:1.5}#chartlet-6eb2843d93367fb7 .chartlet-bar,#chartlet-6eb2843d93367fb7 .chartlet-point{fill:var(--chartlet-accent)}#chartlet-6eb2843d93367fb7 .chartlet-line{fill:none;stroke:var(--chartlet-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}#chartlet-6eb2843d93367fb7 .chartlet-background{fill:var(--chartlet-background)}.chartlet-root{--chartlet-node:#eef3fd;--chartlet-lane:#f7f9fc;--chartlet-lane-head:#eef1f6;--chartlet-shadow:rgba(16,24,40,.09);--chartlet-role-blue:#2563eb;--chartlet-role-blue-fill:#eef3fd;--chartlet-role-green:#15803d;--chartlet-role-green-fill:#ecfdf3;--chartlet-role-amber:#b45309;--chartlet-role-amber-fill:#fff7e8;--chartlet-role-teal:#0f766e;--chartlet-role-teal-fill:#e9faf7;--chartlet-role-violet:#6d28d9;--chartlet-role-violet-fill:#f3efff;--chartlet-role-gray:#667085;--chartlet-role-gray-fill:#f7f8fa;--chartlet-role-red:#b42318;--chartlet-role-red-fill:#fef3f2}.chartlet-root.chartlet-theme-dark{--chartlet-node:#1a2436;--chartlet-lane:#121925;--chartlet-lane-head:#18212f;--chartlet-shadow:rgba(0,0,0,.45);--chartlet-role-blue:#7ea6ff;--chartlet-role-blue-fill:#1a2436;--chartlet-role-green:#4ade80;--chartlet-role-gre