<svg xmlns="http://www.w3.org/2000/svg" width="380" height="420" viewBox="0 0 380 420" id="chartlet-31d98cccd9ac7a0a-m" role="img" aria-labelledby="chartlet-31d98cccd9ac7a0a-m-title chartlet-31d98cccd9ac7a0a-m-description" class="chartlet-root"><title id="chartlet-31d98cccd9ac7a0a-m-title">Wind by direction</title><desc id="chartlet-31d98cccd9ac7a0a-m-description">Polar chart of 8 categories, from the top clockwise: N, NE, E, SE, S, SW, W, NW. Highest: SW (24); lowest: N (6). Percent of hours runs from 0 at the center to 24 at the outer ring.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-31d98cccd9ac7a0a-m .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-31d98cccd9ac7a0a-m .chartlet-label,#chartlet-31d98cccd9ac7a0a-m .chartlet-tick,#chartlet-31d98cccd9ac7a0a-m .chartlet-value,#chartlet-31d98cccd9ac7a0a-m .chartlet-value-inverse,#chartlet-31d98cccd9ac7a0a-m .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-31d98cccd9ac7a0a-m .chartlet-value,#chartlet-31d98cccd9ac7a0a-m .chartlet-value-inverse{font-weight:600}#chartlet-31d98cccd9ac7a0a-m .chartlet-value{fill:var(--chartlet-text)}#chartlet-31d98cccd9ac7a0a-m .chartlet-value-inverse{fill:var(--chartlet-background)}#chartlet-31d98cccd9ac7a0a-m .chartlet-axis-title{font-weight:600}#chartlet-31d98cccd9ac7a0a-m .chartlet-grid{stroke:var(--chartlet-grid);stroke-width:1}#chartlet-31d98cccd9ac7a0a-m .chartlet-zero{stroke:var(--chartlet-zero);stroke-width:1.5}#chartlet-31d98cccd9ac7a0a-m .chartlet-bar,#chartlet-31d98cccd9ac7a0a-m .chartlet-point{fill:var(--chartlet-accent)}#chartlet-31d98cccd9ac7a0a-m .chartlet-line{fill:none;stroke:var(--chartlet-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}#chartlet-31d98cccd9ac7a0a-m .chartlet-background{fill:var(--chartlet-background)}#chartlet-31d98cccd9ac7a0a-m .chartlet-polar-ring{fill:none;stroke:var(--chartlet-grid);stroke-width:1}#chartlet-31d98cccd9ac7a0a-m .chartlet-polar-bar{fill:var(--chartlet-color-1);stroke:none}#chartlet-31d98cccd9ac7a0a-m .chartlet-polar-stem{stroke:var(--chartlet-color-1);stroke-width:2}#chartlet-31d98cccd9ac7a0a-m .chartlet-polar-dot{fill:var(--chartlet-color-1);stroke:var(--chartlet-background);stroke-width:1.5}#chartlet-31d98cccd9ac7a0a-m .chartlet-polar-tick{font-size:11px;fill:var(--chartlet-muted);paint-order:stroke;stroke:var(--chartlet-background);stroke-width:3px;stroke-linejoin:round}#chartlet-31d98cccd9ac7a0a-m .chartlet-title-small{font-size:18px}</style><text x="12" y="30" text-anchor="start" class="chartlet-title chartlet-title-small">Wind by direction</text><circle cx="190" cy="232" r="35.75" class="chartlet-polar-ring"/><circle cx="190" cy="232" r="71.5" class="chartlet-polar-ring"/><circle cx="190" cy="232" r="107.25" class="chartlet-polar-ring"/><circle cx="190" cy="232" r="143" class="chartlet-polar-ring"/><line x1="190" y1="232" x2="190" y2="196.25" class="chartlet-polar-stem"/><circle cx="190" cy="196.25" r="4.5" class="chartlet-polar-dot"><title>N: 6</title></circle><line x1="190" y1="232" x2="227.919" y2="194.081" class="chartlet-polar-stem"/><circle cx="227.919" cy="194.081" r="4.5" class="chartlet-polar-dot"><title>NE: 9</title></circle><line x1="190" y1="232" x2="237.667" y2="232" class="chartlet-polar-stem"/><circle cx="237.667" cy="232" r="4.5" class="chartlet-polar-dot"><title>E: 8</title></circle><line x1="190" y1="232" x2="219.492" y2="261.492" class="chartlet-polar-stem"/><circle cx="219.492" cy="261.492" r="4.5" class="chartlet-polar-dot"><title>SE: 7</title></circle><line x1="190" y1="232" x2="190" y2="297.542" class="chartlet-polar-stem"/><circle cx="190" cy=