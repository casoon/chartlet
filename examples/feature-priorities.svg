id);stroke-width:1}#chartlet-a41c0f286e41d878 .chartlet-zero{stroke:var(--chartlet-zero);stroke-width:1.5}#chartlet-a41c0f286e41d878 .chartlet-bar,#chartlet-a41c0f286e41d878 .chartlet-point{fill:var(--chartlet-accent)}#chartlet-a41c0f286e41d878 .chartlet-line{fill:none;stroke:var(--chartlet-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}#chartlet-a41c0f286e41d878 .chartlet-background{fill:var(--chartlet-background)}#chartlet-a41c0f286e41d878 .chartlet-sc-1{fill:var(--chartlet-color-1)}#chartlet-a41c0f286e41d878 .chartlet-sc-2{fill:var(--chartlet-color-2)}#chartlet-a41c0f286e41d878 .chartlet-sc-3{fill:var(--chartlet-color-3)}#chartlet-a41c0f286e41d878 .chartlet-sc-4{fill:var(--chartlet-color-4)}#chartlet-a41c0f286e41d878 .chartlet-sc-dot{fill-opacity:.65;stroke:none}#chartlet-a41c0f286e41d878 .chartlet-sc-swatch{stroke:none;rx:5px}#chartlet-a41c0f286e41d878 .chartlet-sc-fit{stroke-width:2;fill:none}#chartlet-a41c0f286e41d878 .chartlet-sc-fit.chartlet-sc-1{stroke:var(--chartlet-color-1)}#chartlet-a41c0f286e41d878 .chartlet-sc-fit.chartlet-sc-2{stroke:var(--chartlet-color-2)}#chartlet-a41c0f286e41d878 .chartlet-sc-fit.chartlet-sc-3{stroke:var(--chartlet-color-3)}#chartlet-a41c0f286e41d878 .chartlet-sc-fit.chartlet-sc-4{stroke:var(--chartlet-color-4)}#chartlet-a41c0f286e41d878 .chartlet-sc-line{stroke:var(--chartlet-zero);stroke-width:1.5;stroke-dasharray:5 4}#chartlet-a41c0f286e41d878 .chartlet-sc-label{font-size:11px;font-weight:600;fill:var(--chartlet-text);paint-order:stroke;stroke:var(--chartlet-background);stroke-width:3px;stroke-linejoin:round}#chartlet-a41c0f286e41d878 .chartlet-legend{font-size:12px;fill:var(--chartlet-muted)}</style><text x="72" y="30" text-anchor="start" class="chartlet-title">Feature priorities: impact against effort</text><line x1="72" y1="458" x2="776" y2="458" class="chartlet-zero"/><text x="62" y="462" text-anchor="end" class="chartlet-tick">0</text><line x1="72" y1="379.2" x2="776" y2="379.2" class="chartlet-grid"/><t