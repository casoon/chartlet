ction. Domain API (service): connects to Domain data (reads, writes, via SQL/TLS), Audit log (logs) and SIEM / SOC (events, via Syslog). Domain data (database): connects to Backup (backs up). Audit log (database): no outgoing connection. Backup (storage): no outgoing connection. SIEM / SOC (external system): no outgoing connection.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-993d7890224c2061-m .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-993d7890224c2061-m .chartlet-label,#chartlet-993d7890224c2061-m .chartlet-tick,#chartlet-993d7890224c2061-m .chartlet-value,#chartlet-993d7890224c2061-m .chartlet-value-inverse,#chartlet-993d7890224c2061-m .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-993d7890224c2061-m .chartlet-value,#chartlet-993d7890224c2061-m .chartlet-value-inverse{font-weight:600}#chartlet-993d7890224c2061-m .chartlet-value{fill:var(--chartlet-text)}#chartlet-993d7890224c2061-m .chartlet-value-inverse{fill:var(--chartlet-background)}#chartlet-993d7890224c2061-m .chartlet-axis-title{font-weight:600}#chartlet-993d7890224c2061-m .chartlet-grid{stroke:var(--chartlet-grid);stroke-width:1}#chartlet-993d7890224c2061-m .chartlet-zero{stroke:var(--chartlet-zero);stroke-width:1.5}#chartlet-993d7890224c2061-m .chartlet-bar,#chartlet-993d7890224c2061-m .chartlet-point{fill:var(--chartlet-accent)}#chartlet-993d7890224c2061-m .chartlet-line{fill:none;stroke:var(--chartlet-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}#chartlet-993d7890224c2061-m .chartlet-background{fill:var(--chartlet-background)}#chartlet-993d7890224c2061-m .chartlet-t
