<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" id="chartlet-ae57aec528fa6e1b" role="img" aria-labelledby="chartlet-ae57aec528fa6e1b-title chartlet-ae57aec528fa6e1b-description" class="chartlet-root"><title id="chartlet-ae57aec528fa6e1b-title">Course booking: deployment</title><desc id="chartlet-ae57aec528fa6e1b-description">Architecture diagram with 7 components and 7 connections in 4 boundaries. Cloud region: Job queue, Bookings, Certificates, Container cluster. Container cluster (in Cloud region): Ingress, Node pool: web, Node pool: workers. Node pool: web (in Container cluster): Web app and API. Node pool: workers (in Container cluster): Worker. Main path: Learner → Ingress → Web app and API → Job queue → Worker → Certificates. Most connected: Web app and API and Worker (3 connections each). Nothing leads into Learner. Nothing leads out of Bookings and Certificates. Bottleneck: Web app and API; without it the diagram falls apart. Learner (person): connects to Ingress (opens, via HTTPS). Ingress (service): connects to Web app and API (routes). Web app and API (artifact): connects to Bookings (reads, writes, via SQL/TLS) and Job queue (queues jobs). Job queue (queue): connects to Worker (delivers). Worker (artifact): connects to Certificates (stores certificates) and Bookings (updates, via SQL/TLS). Certificates (storage): no outgoing connection. Bookings (database): no outgoing connection.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-ae57aec528fa6e1b .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-ae57aec528fa6e1b .chartlet-label,#chartl