/><text x="327.3" y="352.308" text-anchor="middle" class="chartlet-seq-message-label">5. miss</text><polyline points="254.6,389.538 536.4,389.538" class="chartlet-seq-message"><title>6. Item API → Item store: SELECT item 42</title></polyline><polyline points="536.4,394.038 545.4,389.538 536.4,385.038 536.4,394.038" class="chartlet-seq-head"/><text x="400" y="383.538" text-anchor="middle" class="chartlet-seq-message-label">6. SELECT item 42</text><polyline points="545.4,420.769 263.6,420.769" class="chartlet-seq-message chartlet-seq-reply"><title>7. Item store → Item API: row</title></polyline><polyline points="263.6,416.269 254.6,420.769 263.6,425.269" class="chartlet-seq-head-open"/><text x="400" y="414.769" text-anchor="middle" class="chartlet-seq-message-label">7. row</text><polyline points="254.6,452 391,452" class="chartlet-seq-message"><title>8. Item API → Cache: set item:42, 5 min</title></polyline><polyline points="391,456.5 400,452 391,447.5" class="chartlet-seq-head-open"/><text x="327.3" y="446" text-anchor="middle" class="chartlet-seq-message-label">8. set item:42, 5 min</text><polyline points="254.6,494 691.8,494" class="chartlet-seq-message"><title>9. Item API → Change feed: item.read</title></polyline><polyline points="691.8,498.5 700.8,494 691.8,489.5" class="chartlet-seq-head-open"/><text x="477.7" y="488" text-anchor="middle" class="chartlet-seq-message-label">9. item.read</text><polyline points="244.6,525.231 108.2,525.231" class="chartlet-seq-message chartlet-seq-reply"><title>10. Item API → Reader: 200 OK</title></polyline><polyline points="108.2,520.731 99.2,525.231 108.2,529.731" class="chartlet-seq-head-open"/><text x="171.9" y="519.231" text-anchor="middle" class="chartlet-seq-message-label">10. 200 OK</text><circle cx="99.2" cy="61.5" r="4.5" class="chartlet-seq-actor-head"/><line x1="99.2" y1="66" x2="99.2" y2="73" class="chartlet-seq-actor"/><line x1="92.2" y1="68.5" x2="106.2" y2="68.5" class="chartlet-seq-actor"/><line x1="99.2" y1="73"