<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" id="chartlet-ba3b1441b8bb7582" role="img" aria-labelledby="chartlet-ba3b1441b8bb7582-title chartlet-ba3b1441b8bb7582-description" class="chartlet-root"><title id="chartlet-ba3b1441b8bb7582-title">Reading an item through the cache</title><desc id="chartlet-ba3b1441b8bb7582-description">Sequence diagram with 5 participants: Reader (actor), Item API, Cache (database), Item store (database) and Change feed (queue). 10 messages, in order: 1. Reader to Item API: GET /items/42. 2. Item API to itself: check token. 3. Item API to Cache: get item:42. 4. Cache to Item API: hit (reply). 5. Cache to Item API: miss (reply). 6. Item API to Item store: SELECT item 42. 7. Item store to Item API: row (reply). 8. Item API to Cache: set item:42, 5 min (asynchronous). 9. Item API to Change feed: item.read (asynchronous). 10. Item API to Reader: 200 OK (reply). Fragment alt &quot;cached&quot; spans messages 4–8, else &quot;not cached&quot; from message 5.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-ba3b1441b8bb7582 .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-ba3b1441b8bb7582 .chartlet-label,#chartlet-ba3b1441b8bb7582 .chartlet-tick,#chartlet-ba3b1441b8bb7582 .chartlet-value,#chartlet-ba3b1441b8bb7582 .chartlet-value-inverse,#chartlet-ba3b1441b8bb7582 .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-ba3b1441b8bb7582 .chartlet-value,#chartlet-ba3b1441b8bb7582 .chartlet-value-inverse{font-weight:600}#chartlet-ba3b1441b8bb7582 .chartlet-value{fill:var(--chartlet-text)}#chartlet-ba3b1441b8bb7582 .chartlet-value-inverse{fill:var(--chartlet-background)}#chartlet-ba3b1441b8bb7582 .chartlet-axis-title{font-weight:600}#chartlet-ba3b1441b8bb7582 .chartlet-grid{stroke:var(--chartlet-grid);stroke-width:1}#chartlet-ba3b1441b8bb7582 .chartlet-zero{stroke:var(--chartlet-zero);stroke-width:1.5}#chartlet-ba3b1441b8bb7582 .chartlet-bar,#chartlet-ba3b1441b8bb7582 .chartlet-point{fill:var(--chartlet-accent)}#chartlet-ba3b1441b8bb7582 .chartlet-line{fill:none;stroke:var(--chartlet-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}#chartlet-ba3b1441b8bb7582 .chartlet-background{fill:var(--chartlet-background)}.chartlet-root{--chartlet-node:#eef3fd}.chartlet-root.chartlet-theme-dark{--chartlet-node:#1a2436}#chartlet-ba3b1441b8bb7582 .chartlet-seq-box{fill:var(--chartlet-node);stroke:var(--chartlet-accent);stroke-width:1.5;rx:5px}#chartlet-ba3b1441b8bb7582 .chartlet-seq-external{fill:var(--chartlet-background);stroke:var(--chartlet-muted);stroke-dasharray:5 3}#chartlet-ba3b1441b8bb7582 .chartlet-seq-rim{fill:none;stroke:var(--chartlet-accent);stroke-width:1.5}#chartlet-ba3b1441b8bb7582 .chartlet-seq-hit{fill:transparent;stroke:none}#chartlet-ba3b1441b8bb7582 .chartlet-seq-actor{stroke:var(--chartlet-text);stroke-width:1.5;stroke-linecap:round}#chartlet-ba3b1441b8bb7582 .chartlet-seq-actor-head{fill:var(--chartlet-background);stroke:var(--chartlet-text);stroke-width:1.5}#chartlet-ba3b1441b8bb7582 .chartlet-seq-label{font-size:13px;font-weight:600;fill:var(--chartlet-text)}#chartlet-ba3b1441b8bb7582 .chartlet-seq-sublabel{font-size:11px;fill:var(--chartlet-muted)}#chartlet-ba3b1441b8bb7582 .chartlet-seq-lifeline{stroke:var(--chartlet-zero);stroke-width:1;stroke-dasharray:4 4}#chartlet-ba3b1441b8bb7582 .chartlet-seq-activation{fill:var(--chartlet-node);stroke:var(--chartlet-accent);stroke-width:1}#chartlet-ba3b1441b8bb7582 .chartlet-seq-message{fill:none;stroke:var(--chartlet-muted);stroke-width:1.5;stroke-linejoin:round}#chartlet-ba3b1441b8bb7582 .chartlet-seq-reply{stroke-dasharray:6 4}#chartlet-ba3b1441b8bb7582 .chartlet-seq-head{fill:var(--chartlet-muted);stroke:var(--chartlet-muted);stroke-width:1;stroke-linejoin:round}#chartlet-ba3b1441b8bb7582 .chartlet-seq-head-open{fill:none;stroke:var(--chartlet-muted);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}#chartlet-ba3b1441b8bb7582 .chartlet-seq-message-label{font-size:12px;fill:var(--chartlet-text);paint-order:stroke;stroke:var(--chartlet-background);stroke-width:3px;stroke-linejoin:round}#chartlet-ba3b1441b8bb7582 .chartlet-seq-frame{fill:none;stroke:var(--chartlet-zero);stroke-width:1}#chartlet-ba3b1441b8bb7582 .chartlet-seq-tab{fill:var(--chartlet-node);stroke:var(--chartlet-zero);stroke-width:1}#chartlet-ba3b1441b8bb7582 .chartlet-seq-tag{font-size:11px;font-weight:650;fill:var(--chartlet-text)}#chartlet-ba3b1441b8bb7582 .chartlet-seq-guard{font-size:11px;fill:var(--chartlet-muted);paint-order:stroke;stroke:var(--chartlet-background);stroke-width:3px;stroke-linejoin:round}#chartlet-ba3b1441b8bb7582 .chartlet-seq-branch{stroke:var(--chartlet-zero);stroke-width:1;stroke-dasharray:5 4}</style><text x="24" y="30" text-anchor="start" class="chartlet-title">Reading an item through the cache</text><line x1="99.2" y1="130" x2="99.2" y2="544" class="chartlet-seq-lifeline"/><line x1="249.6" y1="130" x2="249.6" y2="544" class="chartlet-seq-lifeline"/><line x1="400" y1="130" x2="400" y2="544" class="chartlet-seq-lifeline"/><line x1="550.4" y1="130" x2="550.4" y2="544" class="chartlet-seq-lifeline"/><line x1="700.8" y1="130" x2="700.8" y2="544" class="chartlet-seq-lifeline"/><rect x="244.6" y="164.462" width="10" height="360.769" class="chartlet-seq-activation"/><rect x="395" y="246.308" width="10" height="57.077" class="chartlet-seq-activation"/><rect x="545.4" y="389.538" width="10" height="31.231" class="chartlet-seq-activation"/><rect x="178.4" y="257.077" width="443.2" height="209.692" class="chartlet-seq-frame"/><rect x="178.4" y="257.077" width="27.62" heig