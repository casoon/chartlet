xt">problem</text><rect x="429" y="94" width="200" height="42" class="chartlet-journey-cell"/><text x="436" y="112" text-anchor="start" class="chartlet-journey-text">Follows the steps</text><rect x="635" y="94" width="200" height="42" class="chartlet-journey-cell"/><text x="642" y="112" text-anchor="start" class="chartlet-journey-text">Rates the conversation</text><text x="119" y="109" text-anchor="start" class="chartlet-journey-row">Actions</text><rect x="223" y="142" width="200" height="34" class="chartlet-journey-cell"/><text x="230" y="160" text-anchor="start" class="chartlet-journey-text">Chat widget</text><rect x="429" y="142" width="200" height="34" class="chartlet-journey-cell"/><text x="436" y="160" text-anchor="start" class="chartlet-journey-text">Chat, email</text><rect x="635" y="142" width="200" height="34" class="chartlet-journey-cell"/><text x="642" y="160" text-anchor="start" class="chartlet-journey-text">Email survey</text><text x="119" y="157" text-anchor="start" class="chartlet-journey-row">Touchpoints</text><rect x="223" y="182" width="612" height="96" class="chartlet-journey-cell"/><line x1="223" y1="266" x2="835" y2="266" class="chartlet-journey-scale"/><text x="217" y="270" text-anchor="end" class="chartlet-journey-scale-text">-2</text><line x1="223" y1="248" x2="835" y2="248" class="chartlet-journey-scale"/><text x="217" y="252" text-anchor="end" class="chartlet-journey-scale-text">-1</text><line x1="223" y1="230" x2="835" y2="230" class="chartlet-journey-zero"/><text x="217" y="234" text-anchor="end" class="chartlet-journey-scale-text">0</text><line x1="223" y1="212" x2="835" y2="212" class="chartlet-journey-scale"/><text x="217" y="216" text-anchor="end" class="chartlet-journey-scale-text">+1</text><line x1="223" y1="194" x2="835" y2="194" class="chartlet-journey-scale"/><text x="217" y="198" text-anchor="end" class="chartlet-journey-scale-text">+2</text><polyline points="323,248 529,212 735,194" class="chartlet-journey-sentiment"/><circle 