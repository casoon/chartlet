8d46f3a1f2d0cbd7" role="img" aria-labelledby="chartlet-8d46f3a1f2d0cbd7-title chartlet-8d46f3a1f2d0cbd7-description" class="chartlet-root"><title id="chartlet-8d46f3a1f2d0cbd7-title">Web shop on one cloud region, with symbols</title><desc id="chartlet-8d46f3a1f2d0cbd7-description">Architecture diagram with 11 components and 11 connections in 3 boundaries. Cloud region eu-central-1: Invoices, Private network. Private network (in Cloud region eu-central-1): Shop API, Session cache, Order events, Order worker, Sign-in, Data zone. Data zone (in Private network): Orders. Main path: Customer → Web shop → Shop API → Order events → Order worker → Payment provider. Most connected: Shop API (5 connections). Nothing leads into Customer. Bottleneck: Shop API; without it the diagram falls apart. Customer (person): connects to Web shop (browses). Web shop (frontend, web browser): connects to Content network (loads assets, via HTTPS) and Shop API (calls, via HTTPS/JSON). Shop API (service, container): connects to Session cache (sessions, via RESP), Sign-in (checks token, via OIDC), Orders (reads, writes, via SQL/TLS) and Order events (publishes, via AMQP). Content network (external system, content delivery network): no outgoing connection. Session cache (in-memory cache): no outgoing connection. Order events (queue, message broker): connects to Order worker (delivers). Sign-in (security, identity provider): no outgoing connection. Order worker (service, serverless function): connects to Payment provider (charges, via HTTPS), Invoices (stores PDF, via S3 API) and Orders (updates, via SQL/TLS). Orders (database): no outgoing connection. Invoices (object storage): no outgoing connection. Payment provider (external system, cloud service): no outgoing connection.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c
