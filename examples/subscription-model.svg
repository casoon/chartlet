<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800" id="chartlet-dc093feb2f245ec0" role="img" aria-labelledby="chartlet-dc093feb2f245ec0-title chartlet-dc093feb2f245ec0-description" class="chartlet-root"><title id="chartlet-dc093feb2f245ec0-title">Subscription model</title><desc id="chartlet-dc093feb2f245ec0-description">Class diagram with 6 classes and 5 relations. Most connected: Subscription (3 connections). Bottleneck: Invoice; without it the diagram falls apart. Customer: 2 attributes, 0 methods. Customer is associated with Subscription (1 : 0..*) [holds]. Subscription: 2 attributes, 2 methods. Subscription is associated with Plan (* : 1); is composed of Invoice (1 : 0..*). Plan: 2 attributes, 0 methods. Invoice: 2 attributes, 0 methods. Invoice depends on PaymentMethod [paid with]. PaymentMethod: 0 attributes, 1 method. Card: 1 attribute, 0 methods. Card implements PaymentMethod. Note on Subscription: Renews on the same day each month; a cancelled subscription runs to the end of its period. Note on Plan: Prices are net; tax is added on the invoice. Note on Card: Stores only a token from the payment provider, never the card number.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-dc093feb2f245ec0 .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-dc093feb2f245ec0 .chartlet-label,#chartlet-dc093feb2f245ec0 .chartlet-tick,#chartlet-dc093feb2f245ec0 .chartlet-value,#chartlet-dc093feb2f245ec0 .chartlet-value-inverse,#chartlet-dc093feb2f245ec0 .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-dc093feb2f245ec0 .chartlet-value,#char