<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" id="chartlet-a08e2c1f5423b1c4" role="img" aria-labelledby="chartlet-a08e2c1f5423b1c4-title chartlet-a08e2c1f5423b1c4-description" class="chartlet-root"><title id="chartlet-a08e2c1f5423b1c4-title">What the checkout service depends on</title><desc id="chartlet-a08e2c1f5423b1c4-description">Network with 13 nodes and 14 connections in 3 groups: Shop, Finance and Platform. In rings around Checkout: 1 step away: Cart, Pricing, Payments and Sign-in; 2 steps away: Catalog, Tax rules, Fraud check, Ledger and User store; 3 steps away: Search and Event bus; 4 steps away: Metrics. Most connected: Checkout (4 connections). Nothing leads into Checkout. Bottlenecks: Checkout and Payments; without either the diagram falls apart. Checkout (group Shop): leads to Cart, Pricing, Payments and Sign-in. Cart (group Shop): leads to Catalog. Pricing (group Shop): leads to Catalog and Tax rules. Payments (group Finance): leads to Fraud check and Ledger. Sign-in (group Platform): leads to User store. Catalog (group Shop): leads to Search. Tax rules (group Finance): no outgoing connection. Fraud check (group Finance): leads to Event bus. Ledger (group Finance): leads to Event bus. User store (group Platform): no outgoing connection. Search (group Shop): no outgoing connection. Event bus (group Platform): leads to Metrics. Metrics (group Platform): no outgoing connection.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-a08e2c1f5423b1c4 .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-a08e2c1f5423b1c4 .chartlet-label,#chartlet-a