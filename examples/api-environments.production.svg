<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" id="chartlet-d50eb2f7eb13c789" role="img" aria-labelledby="chartlet-d50eb2f7eb13c789-title chartlet-d50eb2f7eb13c789-description" class="chartlet-root"><title id="chartlet-d50eb2f7eb13c789-title">Orders API in production</title><desc id="chartlet-d50eb2f7eb13c789-description">Architecture diagram with 4 components and 4 connections in 4 boundaries. It shows the environment Production: 4 instances of 3 components of the model; only the connections listed for the instances are drawn. Region eu-central-1: Load balancer (lb-prod), Node A, Node B, Managed database. Node A (in Region eu-central-1): Orders API (api-1). Node B (in Region eu-central-1): Orders API (api-2). Managed database (in Region eu-central-1): Orders (db-prod). Nothing leads into Load balancer (lb-prod). Nothing leads out of Orders (db-prod). Load balancer (lb-prod) (service, load balancer): connects to Orders API (api-1) (routes, via HTTP) and Orders API (api-2) (routes, via HTTP). Orders API (api-1) (service): connects to Orders (db-prod) (reads, writes, via SQL). Orders API (api-2) (service): connects to Orders (db-prod) (reads, writes, via SQL). Orders (db-prod) (database): no outgoing connection.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-d50eb2f7eb13c789 .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-d50eb2f7eb13c789 .chartlet-label,#chartlet-d50eb2f7eb13c789 .chartlet-tick,#chartlet-d50eb2f7eb13c789 .chartlet-value,#chartlet-d50eb2f7eb13c789 .chartlet-value-inverse,#chartlet-d50eb2f7eb13c789 .chartlet-axis-title{font-siz