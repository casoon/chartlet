<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" id="chartlet-153fe2cdd816abcf" role="img" aria-labelledby="chartlet-153fe2cdd816abcf-title chartlet-153fe2cdd816abcf-description" class="chartlet-root"><title id="chartlet-153fe2cdd816abcf-title">Gateway fan-out with shared logging</title><desc id="chartlet-153fe2cdd816abcf-description">Architecture diagram with 8 components and 10 connections in 3 boundaries. Cluster: Gateway, Sign-in, Services. Services (in Cluster): Catalog, Search, Cart, Orders. Operations: Log store. Main path: Client → Gateway → Orders. Most connected: Gateway (6 connections). Nothing leads into Client. Nothing leads out of Sign-in and Log store. Client (frontend): connects to Gateway (calls, via HTTPS). Gateway (service): connects to Sign-in (checks token), Catalog, Search, Cart and Orders. Sign-in (security): no outgoing connection. Catalog (service): connects to Log store. Search (service): connects to Log store. Cart (service): connects to Log store. Orders (service): connects to Log store. Log store (storage): no outgoing connection.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-153fe2cdd816abcf .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-153fe2cdd816abcf .chartlet-label,#chartlet-153fe2cdd816abcf .chartlet-tick,#chartlet-153fe2cdd816abcf .chartlet-value,#chartlet-153fe2cdd816abcf .chartlet-value-inverse,#chartlet-153fe2cdd816abcf .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-153fe2cdd816abcf .chartlet-value,#chartlet-153fe2cdd816abcf .chartlet-value-inverse{font-weight:600}#chartlet-153f