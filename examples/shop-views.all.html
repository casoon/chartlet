r worker (4 connections). Nothing leads into Customer. Nothing leads out of Orders, Invoices and Payment provider. Bottleneck: Shop API; without it the diagram falls apart. Customer (person): connects to Web shop (browses). Web shop (frontend): connects to Shop API (calls, via HTTPS/JSON). Shop API (service): connects to Orders (reads, writes, via SQL/TLS) and Order events (publishes, via AMQP). Order events (queue): connects to Order worker (delivers). Order worker (service): connects to Payment provider (charges, via HTTPS), Invoices (stores PDF, via S3 API) and Orders (updates, via SQL/TLS). Orders (database): no outgoing connection. Invoices (storage): no outgoing connection. Payment provider (external system): no outgoing connection.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-9a7db59109ef66da-v1 .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-9a7db59109ef66da-v1 .chartlet-label,#chartlet-9a7db59109ef66da-v1 .chartlet-tick,#chartlet-9a7db59109ef66da-v1 .chartlet-value,#chartlet-9a7db59109ef66da-v1 .chartlet-value-inverse,#chartlet-9a7db59109ef66da-v1 .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-9a7db59109ef66da-v1 .chartlet-value,#chartlet-9a7db59109ef66da-v1 .chartlet-value-inverse{font-weight:600}#chartlet-9a7db59109ef66da-v1 .chartlet-value{fill:var(--chartlet-text)}#chartlet-9a7db59109ef66da-v1 .chartlet-value-inverse{fill:var(--chartlet-background)}#chartlet-9a7db59109ef66da-v1 .chartlet-axis-title{font-weight:600}#chartlet-9a7db59109ef66da-v1 .chartlet-grid{stroke:var(--chartlet-grid);stroke-width:1}#chartlet-9a7db59109ef66da-v1 .chartlet-ze TLS) and Order events (step 6, order placed, via AMQP). Order events (queue): connects to Order worker (step 7, delivers). Sign-in (security): no outgoing connection. Order worker (service): connects to Payment provider (step 8, charges card, via HTTPS), Orders (step 9, marks paid, via SQL/TLS) and Invoices (step 10, stores PDF, via S3 API). Orders (database): no outgoing connection. Invoices (storage): no outgoing connection. Payment provider (external system): no outgoing connection.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-9a7db59109ef66da-v2 .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-9a7db59109ef66da-v2 .chartlet-label,#chartlet-9a7db59109ef66da-v2 .chartlet-tick,#chartlet-9a7db59109ef66da-v2 .chartlet-value,#chartlet-9a7db59109ef66da-v2 .chartlet-value-inverse,#chartlet-9a7db59109ef66da-v2 .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-9a7db59109ef66da-v2 .chartlet-value,#chartlet-9a7db59109ef66da-v2 .chartlet-value-inverse{font-weight:600}#chartlet-9a7db59109ef66da-v2 .chartlet-value{fill:var(--chartlet-text)}#chartlet-9a7db59109ef66da-v2 .chartlet-value-inverse{fill:var(--chartlet-background)}#chartlet-9a7db59109ef66da-v2 .chartlet-axis-title{font-weight:600}#chartlet-9a7db59109ef66da-v2 .chartlet-grid{stroke:var(--chartlet-grid);stroke-width:1}#chartlet-9a7db59109ef66da-v2 .chartlet-zero{stroke:var(--chartlet-zero);stroke-width:1.5}#chartlet-9a7db59109ef66da-v2 .chartlet-bar,#chartlet-9a7db59109ef66da-v2 .chartlet-point{fill:var(--chartlet-accent)}#chartlet-9a7db59109ef66da-v2 .chartlet-line{fill:none;stroke:var(--chartlet-accent);stroke-
