ted: Order worker (4 connections). Nothing leads into Customer. Nothing leads out of Orders, Invoices and Payment provider. Bottleneck: Shop API; without it the diagram falls apart. Customer (person): connects to Web shop (browses). Web shop (frontend): connects to Shop API (calls, via HTTPS/JSON). Shop API (service): connects to Orders (reads, writes, via SQL/TLS) and Order events (publishes, via AMQP). Order events (queue): connects to Order worker (delivers). Order worker (service): connects to Payment provider (charges, via HTTPS), Invoices (stores PDF, via S3 API) and Orders (updates, via SQL/TLS). Orders (database): no outgoing connection. Invoices (storage): no outgoing connection. Payment provider (external system): no outgoing connection.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-9a7db59109ef66da-v1 .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-9a7db59109ef66da-v1 .chartlet-label,#chartlet-9a7db59109ef66da-v1 .chartlet-tick,#chartlet-9a7db59109ef66da-v1 .chartlet-value,#chartlet-9a7db59109ef66da-v1 .chartlet-value-inverse,#chartlet-9a7db59109ef66da-v1 .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-9a7db59109ef66da-v1 .chartlet-value,#chartlet-9a7db59109ef66da-v1 .chartlet-value-inverse{font-weight:600}#chartlet-9a7db59109ef66da-v1 .chartlet-value{fill:var(--chartlet-text)}#chartlet-9a7db59109ef66da-v1 .chartlet-value-inverse{fill:var(--chartlet-background)}#chartlet-9a7db59109ef66da-v1 .chartlet-axis-title{font-weight:600}#chartlet-9a7db59109ef66da-v1 .chartlet-grid{stroke:var(--chartlet-grid);stroke-width:1}#chartlet-9a7db59109ef66da-v1 .ch tle id="chartlet-9a7db59109ef66da-v2-title">Web shop: checkout</title><desc id="chartlet-9a7db59109ef66da-v2-description">Architecture diagram with 9 components and 10 connections in 3 boundaries. It is a view that shows 9 of the model&#39;s 11 components and 9 of its 11 connections. Cloud region eu-central-1: Invoices, Private network. Private network (in Cloud region eu-central-1): Shop API, Order events, Order worker, Sign-in, Data zone. Data zone (in Private network): Orders. Main path: Customer → Web shop → Shop API → Order events → Order worker → Payment provider. Most connected: Shop API (5 connections). Nothing leads into Customer. Bottleneck: Shop API; without it the diagram falls apart. Steps: 1 Customer → Web shop (places order); 2 Web shop → Shop API (submits order); 3 Shop API → Sign-in (checks token); 4 Shop API → Orders (reserves stock); 5 Shop API → Orders (saves order); 6 Shop API → Order events (order placed); 7 Order events → Order worker (delivers); 8 Order worker → Payment provider (charges card); 9 Order worker → Orders (marks paid); 10 Order worker → Invoices (stores PDF). Customer (person): connects to Web shop (step 1, places order). Web shop (frontend): connects to Shop API (step 2, submits order, via HTTPS/JSON). Shop API (service): connects to Sign-in (step 3, checks token, via OIDC), Orders (step 4, reserves stock, via SQL/TLS), Orders (step 5, saves order, via SQL/TLS) and Order events (step 6, order placed, via AMQP). Order events (queue): connects to Order worker (step 7, delivers). Sign-in (security): no outgoing connection. Order worker (service): connects to Payment provider (step 8, charges card, via HTTPS), Orders (step 9, marks paid, via SQL/TLS) and Invoices (step 10, stores PDF, via S3 API). Orders (database): no outgoing connection. Invoices (storage): no outgoing connection. Payment provider (external system): no outgoing connection.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid
