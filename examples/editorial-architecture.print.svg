<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" id="chartlet-a8258152c4b739bf-p" role="img" aria-labelledby="chartlet-a8258152c4b739bf-p-title chartlet-a8258152c4b739bf-p-description" class="chartlet-root chartlet-look-editorial"><title id="chartlet-a8258152c4b739bf-p-title">A shop on one cloud region</title><desc id="chartlet-a8258152c4b739bf-p-description">Architecture diagram with 6 components and 5 connections in 1 boundary. Cloud region eu-central-1: Shop API, Orders, Order events. Main path: Customer → Web shop → Shop API → Order events → Payment provider. Most connected: Shop API (3 connections). Nothing leads into Customer. Nothing leads out of Orders and Payment provider. Bottleneck: Shop API; without it the diagram falls apart. Customer (person): connects to Web shop (browses). Web shop (frontend): connects to Shop API (calls, via HTTPS/JSON). Shop API (service): connects to Orders (reads, writes, via SQL/TLS) and Order events (publishes, via AMQP). Orders (database): no outgoing connection. Order events (queue): connects to Payment provider (charges, via HTTPS). Payment provider (external system): no outgoing connection.</desc><style>#chartlet-a8258152c4b739bf-p.chartlet-root{max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#1d1c1a}#chartlet-a8258152c4b739bf-p .chartlet-title{font-size:22px;font-weight:600;fill:#1d1c1a}#chartlet-a8258152c4b739bf-p .chartlet-label,#chartlet-a8258152c4b739bf-p .chartlet-tick,#chartlet-a8258152c4b739bf-p .chartlet-value,#chartlet-a8258152c4b739bf-p .chartlet-value-inverse,#chartlet-a8258152c4b739bf-p .chartlet-axis-title{font-size:12px;fill:#4d4a44}#chartlet-a8258152c4b739bf-p .chartlet-value,#chartlet-a8258152c4b739bf-p .chartlet-value-inverse{font-weight:600}#chartlet-a8258152c4b739bf-p .chartlet-value{fill:#1d1c1a}#chartlet-a8258152c4b739bf-p .chartlet-value-inverse{fill:#fcfbf8}#chartlet-a8258152c4b739bf-p .chartlet-axis-title{font-weight:600}#