<svg xmlns="http://www.w3.org/2000/svg" width="1296" height="300" viewBox="0 0 1296 300" id="chartlet-393fca24add6aeed-p" role="img" aria-labelledby="chartlet-393fca24add6aeed-p-title chartlet-393fca24add6aeed-p-description" class="chartlet-root chartlet-look-editorial"><title id="chartlet-393fca24add6aeed-p-title">A shop on one cloud region</title><desc id="chartlet-393fca24add6aeed-p-description">Architecture diagram with 6 components and 5 connections in 1 boundary. Cloud region eu-central-1: Shop API, Orders, Order events. Main path: Customer → Web shop → Shop API → Order events → Payment provider. Most connected: Shop API (3 connections). Nothing leads into Customer. Nothing leads out of Orders and Payment provider. Bottleneck: Shop API; without it the diagram falls apart. Customer (person): connects to Web shop (browses). Web shop (frontend): connects to Shop API (calls, via HTTPS/JSON). Shop API (service): connects to Orders (reads, writes, via SQL/TLS) and Order events (publishes, via AMQP). Orders (database): no outgoing connection. Order events (queue): connects to Payment provider (charges, via HTTPS). Payment provider (external system): no outgoing connection.</desc><style>#chartlet-393fca24add6aeed-p.chartlet-root{max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#1d1c1a}#chartlet-393fca24add6aeed-p .chartlet-title{font-size:22px;font-weight:600;fill:#1d1c1a}#chartlet-393fca24add6aeed-p .chartlet-label,#chartlet-393fca24add6aeed-p .chartlet-tick,#chartlet-393fca24add6aeed-p .chartlet-value,#chartlet-393fca24add6aeed-p .chartlet-value-inverse,#chartlet-393fca24add6aeed-p .chartlet-axis-title{font-size:12px;fill:#4d4a44}#chartlet-393fca24add6aeed-p .chartlet-value,#chartlet-393fca24add6aeed-p .chartlet-value-inverse{font-weight:600}#chartlet-393fca24add6aeed-p .chartlet-value{fill:#1d1c1a}#chartlet-393fca24add6aeed-p .chartlet-value-inverse{fill:#fcfbf8}#chartlet-393fca24add6aeed-p .chartlet-axis-title{font-weight:600}#