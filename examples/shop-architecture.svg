<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="880" viewBox="0 0 1560 880" id="chartlet-75185aa88e3ad235" role="img" aria-labelledby="chartlet-75185aa88e3ad235-title chartlet-75185aa88e3ad235-description" class="chartlet-root"><title id="chartlet-75185aa88e3ad235-title">Web shop on one cloud region</title><desc id="chartlet-75185aa88e3ad235-description">Architecture diagram with 10 components and 10 connections in 3 boundaries. Cloud region eu-central-1: Invoices, Private network. Private network (in Cloud region eu-central-1): Shop API, Session cache, Order events, Order worker, Data zone. Data zone (in Private network): Orders. Main path: Customer → Web shop → Shop API → Order events → Order worker → Payment provider. Customer (person): connects to Web shop (browses). Web shop (frontend): connects to Content network (loads assets, via HTTPS) and Shop API (calls, via HTTPS/JSON). Shop API (service): connects to Session cache (sessions, via RESP), Orders (reads, writes, via SQL/TLS) and Order events (publishes, via AMQP). Content network (external system): no outgoing connection. Session cache (cache): no outgoing connection. Order events (queue): connects to Order worker (delivers). Order worker (service): connects to Payment provider (charges, via HTTPS), Invoices (stores PDF, via S3 API) and Orders (updates, via SQL/TLS). Payment provider (external system): no outgoing connection. Invoices (storage): no outgoing connection. Orders (database): no outgoing connection.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-75185aa88e3ad235 .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)