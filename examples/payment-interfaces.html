s and 7 connections in 1 boundary. Shop platform: Checkout, Support, Orders, Payments, Order store. Main path: Shopper → Web shop → Checkout → Payments → Card processor. Most connected: Checkout and Payments (3 connections each). Nothing leads into Shopper and Support. Nothing leads out of Order store and Card processor. Bottleneck: Checkout; without it the diagram falls apart. Shopper (person): connects to Web shop (buys). Web shop (frontend): connects to Checkout (submits, via HTTPS). Checkout (service): connects to Orders (requires Orders API, places) and Payments (requires Payments API, charges). Support (service): connects to Payments (requires Refunds API, refunds). Orders (service): connects to Order store (via SQL). Payments (service): connects to Card processor (via HTTPS). Order store (database): no outgoing connection. Card processor (external system): no outgoing connection. Orders provides Orders API. Payments provides Payments API and Refunds API.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-ac00efa1be5a1b96 .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-ac00efa1be5a1b96 .chartlet-label,#chartlet-ac00efa1be5a1b96 .chartlet-tick,#chartlet-ac00efa1be5a1b96 .chartlet-value,#chartlet-ac00efa1be5a1b96 .chartlet-value-inverse,#chartlet-ac00efa1be5a1b96 .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-ac00efa1be5a1b96 .chartlet-value,#chartlet-ac00efa1be5a1b96 .chartlet-value-inverse{font-weight:600}#chartlet-ac00efa1be5a1b96 .chartlet-value{fill:var(--chartlet-text)}#chartlet-ac00efa1be5a1b96 .chartlet-value-inverse{fill:var(--chartlet-background)}
