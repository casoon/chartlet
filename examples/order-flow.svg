<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="420" viewBox="0 0 1344 420" id="chartlet-8bb238ebf6fddad1" role="img" aria-labelledby="chartlet-8bb238ebf6fddad1-title chartlet-8bb238ebf6fddad1-description" class="chartlet-root"><title id="chartlet-8bb238ebf6fddad1-title">Handling an order</title><desc id="chartlet-8bb238ebf6fddad1-description">Flow chart with 10 steps and 10 connections. Main path: Order received → Payment cleared? → Reserve stock → In stock? → Ship parcel → Delivered. Most connected: Reserve stock (4 connections). Nothing leads out of Inventory. Loop: Reserve stock → In stock? → Backorder → Reserve stock. Order received (start): leads to Payment cleared?. Payment cleared? (decision): leads to Reserve stock (yes) and Notify customer (no). Reserve stock: leads to Inventory (update) and In stock?. Notify customer (input or output): leads to Cancelled. Inventory (data store): no further step. In stock? (decision): leads to Ship parcel (yes) and Backorder (no). Cancelled (end): no further step. Ship parcel: leads to Delivered. Backorder (subprocess): leads to Reserve stock (restocked). Delivered (end): no further step.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-8bb238ebf6fddad1 .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-8bb238ebf6fddad1 .chartlet-label,#chartlet-8bb238ebf6fddad1 .chartlet-tick,#chartlet-8bb238ebf6fddad1 .chartlet-value,#chartlet-8bb238ebf6fddad1 .chartlet-value-inverse,#chartlet-8bb238ebf6fddad1 .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-8bb238ebf6fddad1 .chartlet-value,#chartlet-8bb238ebf6fddad1 .char