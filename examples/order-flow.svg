let-muted)}#chartlet-8bb238ebf6fddad1 .chartlet-flow-edge{fill:none;stroke:var(--chartlet-zero);stroke-width:1.4;stroke-linejoin:round}#chartlet-8bb238ebf6fddad1 .chartlet-flow-dashed{stroke-dasharray:5 4}#chartlet-8bb238ebf6fddad1 .chartlet-flow-dotted{stroke-dasharray:1 4;stroke-linecap:round}#chartlet-8bb238ebf6fddad1 .chartlet-flow-main{stroke:var(--chartlet-accent);stroke-width:2.2}#chartlet-8bb238ebf6fddad1 .chartlet-flow-head{fill:var(--chartlet-zero);stroke:var(--chartlet-zero);stroke-width:1;stroke-linejoin:round}#chartlet-8bb238ebf6fddad1 .chartlet-flow-main-head{fill:var(--chartlet-accent);stroke:var(--chartlet-accent)}#chartlet-8bb238ebf6fddad1 .chartlet-flow-lane{fill:var(--chartlet-lane);stroke:var(--chartlet-grid);stroke-width:1}#chartlet-8bb238ebf6fddad1 .chartlet-flow-lane-alt{fill:var(--chartlet-background)}#chartlet-8bb238ebf6fddad1 .chartlet-flow-lane-head{fill:var(--chartlet-lane-head);stroke:none}#chartlet-8bb238ebf6fddad1 .chartlet-flow-lane-label{font-size:11px;font-weight:650;fill:var(--chartlet-muted);letter-spacing:.04em}#chartlet-8bb238ebf6fddad1 .chartlet-flow-group{fill:var(--chartlet-accent);fill-opacity:.04;stroke:var(--chartlet-zero);stroke-width:1;stroke-dasharray:4 3;rx:10px}#chartlet-8bb238ebf6fddad1 .chartlet-flow-group-label{font-size:11px;font-weight:600;fill:var(--chartlet-muted)}</style><text x="24" y="30" text-anchor="start" class="chartlet-title">Handling an order</text><g class="chartlet-f chartlet-f-0 chartlet-f-1"><polyline points="152,232 172,232" class="chartlet-flow-edge chartlet-flow-main"><title>Order received → Payment cleared?</title></polyline><polyline points="172,235.5 180,232 172,228.5 172,235.5" class="chartlet-flow-head chartlet-flow-main-head"/></g><g class="chartlet-f chartlet-f-1 chartlet-f-2"><polyline points="372,232 472,232" class="chartlet-flow-edge chartlet-flow-main"><title>Payment cleared? → Reserve stock: yes</title></polyline><polyline points="472,235.5 480,232 472,228.5 472,235.5" class="chartle