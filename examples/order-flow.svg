<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" id="chartlet-b1fb78e7acf31e30" role="img" aria-labelledby="chartlet-b1fb78e7acf31e30-title chartlet-b1fb78e7acf31e30-description" class="chartlet-root"><title id="chartlet-b1fb78e7acf31e30-title">Handling an order</title><desc id="chartlet-b1fb78e7acf31e30-description">Flow chart with 10 steps and 10 connections. Main path: Order received → Payment cleared? → Reserve stock → In stock? → Ship parcel → Delivered. Order received (start): leads to Payment cleared?. Payment cleared? (decision): leads to Reserve stock (yes) and Notify customer (no). Reserve stock: leads to Inventory (update) and In stock?. Notify customer (input or output): leads to Cancelled. Inventory (data store): no further step. In stock? (decision): leads to Ship parcel (yes) and Backorder (no). Cancelled (end): no further step. Ship parcel: leads to Delivered. Backorder (subprocess): leads to Reserve stock (restocked). Delivered (end): no further step.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-b1fb78e7acf31e30 .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-b1fb78e7acf31e30 .chartlet-label,#chartlet-b1fb78e7acf31e30 .chartlet-tick,#chartlet-b1fb78e7acf31e30 .chartlet-value,#chartlet-b1fb78e7acf31e30 .chartlet-value-inverse,#chartlet-b1fb78e7acf31e30 .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-b1fb78e7acf31e30 .chartlet-value,#chartlet-b1fb78e7acf31e30 .chartlet-value-inverse{font-weight:600}#chartlet-b1fb78e7acf31e30 .chartlet-value{fill:var(--chartlet-text)}#chartlet-b1fb78e7acf31e30 .chartlet-value-inverse{fill:var(--chartlet-background)}#chartlet-b1fb78e7acf31e30 .chartlet-axis-title{font-weight:600}#chartlet-b1fb78e7acf31e30 .chartlet-grid{stroke:var(--chartlet-grid);stroke-width:1}#chartlet-b1fb78e7acf31e30 .chartlet-zero{stroke:var(--chartlet-zero);stroke-width:1.5}#chartlet-b1fb78e7acf31e30 .chartlet-bar,#chartlet-b1fb78e7acf31e30 .chartlet-point{fill:var(--chartlet-accent)}#chartlet-b1fb78e7acf31e30 .chartlet-line{fill:none;stroke:var(--chartlet-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}#chartlet-b1fb78e7acf31e30 .chartlet-background{fill:var(--chartlet-background)}.chartlet-root{--chartlet-node:#eef3fd;--chartlet-lane:#f6f8fc}.chartlet-root.chartlet-theme-dark{--chartlet-node:#1a2436;--chartlet-lane:#131a26}#chartlet-b1fb78e7acf31e30 .chartlet-flow-node{fill:var(--chartlet-node);stroke:var(--chartlet-accent);stroke-width:1.5;stroke-linejoin:round;rx:5px}#chartlet-b1fb78e7acf31e30 .chartlet-flow-start{stroke-width:2}#chartlet-b1fb78e7acf31e30 .chartlet-flow-end{stroke-width:3}#chartlet-b1fb78e7acf31e30 .chartlet-flow-external{fill:var(--chartlet-background);stroke:var(--chartlet-muted);stroke-dasharray:5 3}#chartlet-b1fb78e7acf31e30 .chartlet-flow-inner{stroke:var(--chartlet-accent);stroke-width:1}#chartlet-b1fb78e7acf31e30 .chartlet-flow-rim{fill:none;stroke:var(--chartlet-accent);stroke-width:1.5}#chartlet-b1fb78e7acf31e30 .chartlet-flow-label{font-size:13px;font-weight:600;fill:var(--chartlet-text)}#chartlet-b1fb78e7acf31e30 .chartlet-flow-sublabel{font-size:11px;fill:var(--chartlet-muted)}#chartlet-b1fb78e7acf31e30 .chartlet-flow-edge{fill:none;stroke:var(--chartlet-muted);stroke-width:1.5;stroke-linejoin:round}#chartlet-b1fb78e7acf31e30 .chartlet-flow-dashed{stroke-dasharray:6 4}#chartlet-b1fb78e7acf31e30 .chartlet-flow-dotted{stroke-dasharray:1 4;stroke-linecap:round}#chartlet-b1fb78e7acf31e30 .chartlet-flow-main{stroke:var(--chartlet-accent);stroke-width:2.5}#chartlet-b1fb78e7acf31e30 .chartlet-flow-head{fill:var(--chartlet-muted);stroke:var(--chartlet-muted);stroke-width:1;stroke-linejoin:round}#chartlet-b1fb78e7acf31e30 .chartlet-flow-main-head{fill:var(--chartlet-accent);stroke:var(--chartlet-accent)}#chartlet-b1fb78e7acf31e30 .chartlet-flow-edge-label{font-size:12px;fill:var(--chartlet-text);paint-order:stroke;stroke:var(--chartlet-background);stroke-width:3px;stroke-linejoin:round}#chartlet-b1fb78e7acf31e30 .chartlet-flow-lane{fill:var(--chartlet-lane);stroke:var(--chartlet-grid);stroke-width:1}#chartlet-b1fb78e7acf31e30 .chartlet-flow-lane-alt{fill:var(--chartlet-background)}#chartlet-b1fb78e7acf31e30 .chartlet-flow-lane-label{font-size:11px;font-weight:650;fill:var(--chartlet-muted);letter-spacing:.04em}#chartlet-b1fb78e7acf31e30 .chartlet-flow-group{fill:none;stroke:var(--chartlet-zero);stroke-width:1;stroke-dasharray:4 3;rx:8px}#chartlet-b1fb78e7acf31e30 .chartlet-flow-group-label{font-size:11px;font-weight:600;fill:var(--chartlet-muted)}</style><text x="24" y="30" text-anchor="start" class="chartlet-title">Handling an order</text><polyline points="144.85,235 165.16,235" class="chartlet-flow-edge chartlet-flow-main"><title>Order received → Payment cleared?</title></polyline><polyline points="165.16,239.5 174.16,235 165.16,230.5 165.16,239.5" class="chartlet-flow-head chartlet-flow-main-head"/><polyline points="361.99,235 446.328,235" class="chartlet-flow-edge chartlet-flow-main"><title>Payment cleared? → Reserve stock: yes</title></polyline><polyline points="446.328,239.5 455.328,235 446.328,230.5 446.328,239.5" class="chartlet-flow-head chartlet-flow-main-head"/><text x="367.99" y="230" text-anchor="start" class="chartlet-flow-edge-label">yes</text><polyline points="305.641,253 412.404,253 412.404,306 428.528,306" class="chartlet-flow-edge"><title>Payment cleared? → Notify customer: no</title></polyline><polyline points="428.528,310.5 437.528,306 428.528,301.5 428.528,310.5" class="chartlet-flow-head"/><text x="311.641" y="268" text-anchor="start" class="chartlet-flow-edge-label">no</text><polyline points="572.278,218.333 661.595,218.333 661.595,154 701.718,154" class="chartlet-flow-edge chartlet-flow-dotted"><title>Reserve stock → Inventory: update</title></polyline><polyline points="701.718,158.5 710.718,154 701.718,149.5 701.718,158.5" class="chartlet-flow-head"/><text x="578.278" y="213.333" text-anchor="start" class="chartlet-flow-edge-label">update</text><polyline points="572.278,235 677.718,235" class="chartlet-flow-edge chartlet-flow-main"><title>Reserve stock → In stock?</title></polyline><polyline points="677.718,239.5 686.718,235 677.718,230.5 677.718,239.5" class="chartlet-flow-head chartlet-flow-main-head"/><polyline points="838.718,235 1001.69,235" class="chartlet-flow-edge chartlet-flow-main"><title>In stock? → Ship parcel: yes</title></polyline><polyline points="1001.69,239.5 1010.69,235 1001.69,230.5 1001.69,239.5" class="chartlet-flow-head chartlet-flow-main-head"/><text x="844.718" y="230" text-anchor="start" class="chartlet-flow-edge-label">yes</text><polyline points="793.118,253 889.132,253 889.132,294 993.69,294" class="chartlet-flow-edge"><title>In stock? → Backorder: no</title></polyline><polyline points="993.69,298.5 1002.69,294 993.69,289.5 993.69,298.5" class="chartlet-flow-head"/><text x="799.118" y="268" text-anchor="start" class="chartlet-flow-edge-label">no</text><polyline points="1002.69,318 899.6,318 899.6,279 661.595,279 661.595,251.667 581.278,251.667" class="chartlet-flow-edge chartlet-flow-dashed"><title>Backorder → Reserve stock: restocked</title></polyline><polyline points="581.278,247.167 572.278,251.667 581.278,256.167 581.278,247.167" class="chartlet-flow-head"/><text x="996.69" y="333" text-anchor="end" class="chartlet-flow-edge-label">restocked</text><polyline points="1114.69,235 1143,235" class="chartlet-flow-edge chartlet-flow-main"><title>Ship parcel → Delivered</title></polyline><polyline points="1143,239.5 1152,235 1143,230.5 1143,239.5" class="chartlet-flow-head chartlet-flow-main-head"/><polyline points="590.078,306 661.595,306 661.595,311 701.718,311" class="chartlet-flow-edge"><title>Notify customer → Cancelled</title></polyline><polyline points="701.718,315.5 710.718,311 701.718,306.5 701.718,315.5" class="chartlet-flow-head"/><polyline points="126.85,217 133.738,218.37 139.578,222.272 143.48,228.112 144.85,235 143.48,241.888 139.578,247.728 133.738,251.63 126.85,253 42,253 35.112,251.63 29.272,247.728 25.37,241.888 24,235 25.37,228.112 29.272,222.272 35.112,218.37 42,217 126.85,217" class="chartlet-flow-node chartlet-flow-start"><title>Order received</title></polyline><text x="84.425" y="239.5" text-anchor="middle" class="chartlet-flow-label">Order received</text><polyline points="268.075,205 361.99,235 268.075,265 174.16,235 268.075,205" class="chartlet-flow-node"><title>Payment cleared?</title></polyline><text x="268.075" y="239.5" text-anchor="middle" class="chartlet-flow-label">Payment cleared?</text><rect x="455.328" y="210" width="116.95" height="50" class="chartlet-flow-node"><title>Reserve stock</title></rect><text x="513.803" y="239.5" text-anchor="middle" class="chartlet-flow-label">Reserve stock</text><polyline points="710.718,136 710.718,172 712.49,173.294 717.685,174.5 725.949,175.536 736.718,176.33 749.26,176.83 762.718,177 776.177,176.83 788.718,176.33 799.488,175.536 807.752,174.5 812.947,173.294 814.718,172 814.718,136 812.947,134.706 807.752,133.5 799.488,132.464 788.718,131.67 776.177,131.17 762.718,131 749.26,131.17 736.718,131.67 725.949,132.464 717.685,133.5 712.49,134.706 710.718,136 710.718,136" class="chartlet-flow-node"><title>Inventory</title></polyline><polyline points="710.718,136 712.49,137.294 717.685,138.5 725.949,139.536 736.718,140.33 749.26,140.83 762.718,141 776.177,140.83 788.718,140.33 799.488,139.536 807.752,138.5 812.947,137.294 814.718,136" class="chartlet-flow-rim"/><text x="762.718" y="161.5" text-anchor="middle" class="chartlet-flow-label">Inventory</text><polyline points="762.718,205 838.718,235 762.718,265 686.718,235 762.718,205" class="chartlet-flow-node"><title>In stock?</title></polyline><text x="762.718" y="239.5" text-anchor="middle" class="chartlet-flow-label">In stock?</text><rect x="1002.69" y="281" width="120" height="50" class="chartlet-flow-node"><title>Backorder – supplier</title></rect><line x1="1009.69" y1="281" x2="1009.69" y2="331" class="chartlet-flow-inner"/><line x1="1115.69" y1="281" x2="1115.69" y2="331" class="chartlet-flow-inner"/><text x="1062.69" y="303.5" text-anchor="middle" class="chartlet-flow-label">Backorder</text><text x="1062.69" y="317.5" text-anchor="middle" class="chartlet-flow-sublabel">supplier</text><rect x="1010.69" y="217" width="104" height="36" class="chartlet-flow-node"><title>Ship parcel</title></rect><text x="1062.69" y="239.5" text-anchor="middle" class="chartlet-flow-label">Ship parcel</text><polyline points="447.528,288 590.078,288 580.078,324 437.528,324 447.528,288" class="chartlet-flow-node"><title>Notify customer</title></polyline><text x="513.803" y="310.5" text-anchor="middle" class="chartlet-flow-label">Notify customer</text><polyline points="1238,217 1244.888,218.37 1250.728,222.272 1254.63,228.112 1256,235 1254.63,241.888 1250.728,247.728 1244.888,251.63 1238,253 1170,253 1163.112,251.63 1157.272,247.728 1153.37,241.888 1152,235 1153.37,228.112 1157.272,222.272 1163.112,218.37 1170,217 1238,217" class="chartlet-flow-node chartlet-flow-end"><title>Delivered</title></polyline><text x="1204" y="239.5" text-anchor="middle" class="chartlet-flow-label">Delivered</text><polyline points="796.718,293 803.607,294.37 809.446,298.272 813.348,304.112 814.718,311 813.348,317.888 809.446,323.728 803.607,327.63 796.718,329 728.718,329 721.83,327.63 715.991,323.728 712.089,317.888 710.718,311 712.089,304.112 715.991,298.272 721.83,294.37 728.718,293 796.718,293" class="chartlet-flow-node chartlet-flow-end"><title>Cancelled</title></polyline><text x="762.718" y="315.5" text-anchor="middle" class="chartlet-flow-label">Cancelled</text></svg>