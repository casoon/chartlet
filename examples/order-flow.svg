<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="420" viewBox="0 0 1320 420" id="chartlet-8bb238ebf6fddad1" role="img" aria-labelledby="chartlet-8bb238ebf6fddad1-title chartlet-8bb238ebf6fddad1-description" class="chartlet-root"><title id="chartlet-8bb238ebf6fddad1-title">Handling an order</title><desc id="chartlet-8bb238ebf6fddad1-description">Flow chart with 10 steps and 10 connections. Main path: Order received → Payment cleared? → Reserve stock → In stock? → Ship parcel → Delivered. Order received (start): leads to Payment cleared?. Payment cleared? (decision): leads to Reserve stock (yes) and Notify customer (no). Reserve stock: leads to Inventory (update) and In stock?. Notify customer (input or output): leads to Cancelled. Inventory (data store): no further step. In stock? (decision): leads to Ship parcel (yes) and Backorder (no). Cancelled (end): no further step. Ship parcel: leads to Delivered. Backorder (subprocess): leads to Reserve stock (restocked). Delivered (end): no further step.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-8bb238ebf6fddad1 .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-8bb238ebf6fddad1 .chartlet-label,#chartlet-8bb238ebf6fddad1 .chartlet-tick,#chartlet-8bb238ebf6fddad1 .chartlet-value,#chartlet-8bb238ebf6fddad1 .chartlet-value-inverse,#chartlet-8bb238ebf6fddad1 .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-8bb238ebf6fddad1 .chartlet-value,#chartlet-8bb238ebf6fddad1 .chartlet-value-inverse{font-weight:600}#chartlet-8bb238ebf6fddad1 .chartlet-value{fill:var(--chartlet-text)}#chartlet-8bb238ebf6fddad1 .chartlet-value-inverse{fill:var(--chartlet-background)}#chartlet-8bb238ebf6fddad1 .chartlet-axis-title{font-weight:600}#chartlet-8bb238ebf6fddad1 .chartlet-grid{stroke:var(--chartlet-grid);stroke-width:1}#chartlet-8bb238ebf6fddad1 .chartlet-zero{stroke:var(--chartlet-zero);stroke-width:1.5}#chartlet-8bb238ebf6fddad1 .chartlet-bar,#chartlet-8bb238ebf6fddad1 .chartlet-point{fill:var(--chartlet-accent)}#chartlet-8bb238ebf6fddad1 .chartlet-line{fill:none;stroke:var(--chartlet-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}#chartlet-8bb238ebf6fddad1 .chartlet-background{fill:var(--chartlet-background)}.chartlet-root{--chartlet-node:#eef3fd;--chartlet-lane:#f7f9fc;--chartlet-lane-head:#eef1f6;--chartlet-shadow:rgba(16,24,40,.09);--chartlet-role-blue:#2563eb;--chartlet-role-blue-fill:#eef3fd;--chartlet-role-green:#15803d;--chartlet-role-green-fill:#ecfdf3;--chartlet-role-amber:#b45309;--chartlet-role-amber-fill:#fff7e8;--chartlet-role-teal:#0f766e;--chartlet-role-teal-fill:#e9faf7;--chartlet-role-violet:#6d28d9;--chartlet-role-violet-fill:#f3efff;--chartlet-role-gray:#667085;--chartlet-role-gray-fill:#f7f8fa}.chartlet-root.chartlet-theme-dark{--chartlet-node:#1a2436;--chartlet-lane:#121925;--chartlet-lane-head:#18212f;--chartlet-shadow:rgba(0,0,0,.45);--chartlet-role-blue:#7ea6ff;--chartlet-role-blue-fill:#1a2436;--chartlet-role-green:#4ade80;--chartlet-role-green-fill:#132a1d;--chartlet-role-amber:#fbbf24;--chartlet-role-amber-fill:#2b2210;--chartlet-role-teal:#2dd4bf;--chartlet-role-teal-fill:#0f2a27;--chartlet-role-violet:#b69cff;--chartlet-role-violet-fill:#231c38;--chartlet-role-gray:#9aa7bd;--chartlet-role-gray-fill:#161d29}#chartlet-8bb238ebf6fddad1 .chartlet-role-blue{fill:var(--chartlet-role-blue-fill);stroke:var(--chartlet-role-blue)}#chartlet-8bb238ebf6fddad1 .chartlet-role-green{fill:var(--chartlet-role-green-fill);stroke:var(--chartlet-role-green)}#chartlet-8bb238ebf6fddad1 .chartlet-role-amber{fill:var(--chartlet-role-amber-fill);stroke:var(--chartlet-role-amber)}#chartlet-8bb238ebf6fddad1 .chartlet-role-teal{fill:var(--chartlet-role-teal-fill);stroke:var(--chartlet-role-teal)}#chartlet-8bb238ebf6fddad1 .chartlet-role-violet{fill:var(--chartlet-role-violet-fill);stroke:var(--chartlet-role-violet)}#chartlet-8bb238ebf6fddad1 .chartlet-role-gray{fill:var(--chartlet-role-gray-fill);stroke:var(--chartlet-role-gray)}#chartlet-8bb238ebf6fddad1 .chartlet-diagram-rim{fill:none;stroke:var(--chartlet-role-teal);stroke-width:1.5}#chartlet-8bb238ebf6fddad1 .chartlet-diagram-shadow{fill:var(--chartlet-shadow);stroke:none;rx:7px}#chartlet-8bb238ebf6fddad1 .chartlet-diagram-chip{fill:var(--chartlet-background);stroke:var(--chartlet-grid);stroke-width:1;rx:4px}#chartlet-8bb238ebf6fddad1 .chartlet-diagram-chip-text{font-size:12px;fill:var(--chartlet-text)}#chartlet-8bb238ebf6fddad1 .chartlet-diagram-badge{fill:var(--chartlet-accent);stroke:var(--chartlet-background);stroke-width:2}#chartlet-8bb238ebf6fddad1 .chartlet-diagram-badge-text{font-size:10px;font-weight:700;fill:var(--chartlet-background)}#chartlet-8bb238ebf6fddad1 .chartlet-flow-node{stroke-width:1.5;stroke-linejoin:round;rx:7px}#chartlet-8bb238ebf6fddad1 .chartlet-flow-start{stroke-width:2}#chartlet-8bb238ebf6fddad1 .chartlet-flow-end{stroke-width:3}#chartlet-8bb238ebf6fddad1 .chartlet-flow-external{stroke-dasharray:5 3}#chartlet-8bb238ebf6fddad1 .chartlet-flow-inner{stroke:var(--chartlet-role-blue);stroke-width:1}#chartlet-8bb238ebf6fddad1 .chartlet-flow-label{font-size:13px;font-weight:600;fill:var(--chartlet-text)}#chartlet-8bb238ebf6fddad1 .chartlet-flow-sublabel{font-size:11px;fill:var(--chartlet-muted)}#chartlet-8bb238ebf6fddad1 .chartlet-flow-edge{fill:none;stroke:var(--chartlet-zero);stroke-width:1.4;stroke-linejoin:round}#chartlet-8bb238ebf6fddad1 .chartlet-flow-dashed{stroke-dasharray:5 4}#chartlet-8bb238ebf6fddad1 .chartlet-flow-dotted{stroke-dasharray:1 4;stroke-linecap:round}#chartlet-8bb238ebf6fddad1 .chartlet-flow-main{stroke:var(--chartlet-accent);stroke-width:2.2}#chartlet-8bb238ebf6fddad1 .chartlet-flow-head{fill:var(--chartlet-zero);stroke:var(--chartlet-zero);stroke-width:1;stroke-linejoin:round}#chartlet-8bb238ebf6fddad1 .chartlet-flow-main-head{fill:var(--chartlet-accent);stroke:var(--chartlet-accent)}#chartlet-8bb238ebf6fddad1 .chartlet-flow-lane{fill:var(--chartlet-lane);stroke:var(--chartlet-grid);stroke-width:1}#chartlet-8bb238ebf6fddad1 .chartlet-flow-lane-alt{fill:var(--chartlet-background)}#chartlet-8bb238ebf6fddad1 .chartlet-flow-lane-head{fill:var(--chartlet-lane-head);stroke:none}#chartlet-8bb238ebf6fddad1 .chartlet-flow-lane-label{font-size:11px;font-weight:650;fill:var(--chartlet-muted);letter-spacing:.04em}#chartlet-8bb238ebf6fddad1 .chartlet-flow-group{fill:var(--chartlet-accent);fill-opacity:.04;stroke:var(--chartlet-zero);stroke-width:1;stroke-dasharray:4 3;rx:10px}#chartlet-8bb238ebf6fddad1 .chartlet-flow-group-label{font-size:11px;font-weight:600;fill:var(--chartlet-muted)}</style><text x="24" y="30" text-anchor="start" class="chartlet-title">Handling an order</text><polyline points="144.85,233 166.175,233" class="chartlet-flow-edge chartlet-flow-main"><title>Order received → Payment cleared?</title></polyline><polyline points="166.175,236.5 174.175,233 166.175,229.5 166.175,236.5" class="chartlet-flow-head chartlet-flow-main-head"/><polyline points="362.005,233 459.949,233" class="chartlet-flow-edge chartlet-flow-main"><title>Payment cleared? → Reserve stock: yes</title></polyline><polyline points="459.949,236.5 467.949,233 459.949,229.5 459.949,236.5" class="chartlet-flow-head chartlet-flow-main-head"/><polyline points="305.656,251 425.013,251 425.013,304 442.149,304" class="chartlet-flow-edge"><title>Payment cleared? → Notify customer: no</title></polyline><polyline points="442.149,307.5 450.149,304 442.149,300.5 442.149,307.5" class="chartlet-flow-head"/><polyline points="584.899,216.333 686.821,216.333 686.821,147 727.957,147" class="chartlet-flow-edge chartlet-flow-dotted"><title>R