<svg xmlns="http://www.w3.org/2000/svg" width="380" height="1300" viewBox="0 0 380 1300" id="chartlet-d0a8a7f346e151bf-m" role="img" aria-labelledby="chartlet-d0a8a7f346e151bf-m-title chartlet-d0a8a7f346e151bf-m-description" class="chartlet-root"><title id="chartlet-d0a8a7f346e151bf-m-title">Service blueprint of a support request</title><desc id="chartlet-d0a8a7f346e151bf-m-description">Service blueprint of 3 stages, with the customer&#39;s rows above the line of interaction and the service&#39;s below it: Ask: actions: Opens a chat and describes the problem; touchpoints: Chat widget; sentiment: -1; frontstage: Greets the customer and asks for the account; backstage: Routes the chat by product and language; support: Chat platform, customer database. Solve: actions: Follows the steps; touchpoints: Chat, email; sentiment: +1; frontstage: Sends the steps and checks that they worked; backstage: Files a bug when the cause is the product; support: Knowledge base, issue tracker. Close: actions: Rates the conversation; touchpoints: Email survey; sentiment: +2; frontstage: Thanks the customer and closes the chat; backstage: Tags the conversation, updates the article; support: Survey tool, knowledge base.</desc><style>.chartlet-root{--chartlet-text:#172033;--chartlet-muted:#344054;--chartlet-grid:#d9dee8;--chartlet-zero:#667085;--chartlet-accent:#2563eb;--chartlet-background:#fff;--chartlet-color-1:#2563eb;--chartlet-color-2:#c2410c;--chartlet-color-3:#475569;--chartlet-color-4:#111827;max-width:100%;height:auto;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--chartlet-text)}#chartlet-d0a8a7f346e151bf-m .chartlet-title{font-size:22px;font-weight:650;fill:var(--chartlet-text)}#chartlet-d0a8a7f346e151bf-m .chartlet-label,#chartlet-d0a8a7f346e151bf-m .chartlet-tick,#chartlet-d0a8a7f346e151bf-m .chartlet-value,#chartlet-d0a8a7f346e151bf-m .chartlet-value-inverse,#chartlet-d0a8a7f346e151bf-m .chartlet-axis-title{font-size:12px;fill:var(--chartlet-muted)}#chartlet-d